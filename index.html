<meta charset="utf-8">
<title>Jam Cycle Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --ink:#1B2430; --muted:#5C6878; --line:#DCE1E9; --line-strong:#B9C2CF;
  --hover:#EEF1F6; --chip:#E9EDF3;
  --product:#2F6FDB; --engineering:#2E9E5B; --design:#D9961F; --pmm:#CF3F97; --program:#6B5BD2;
  --product-soft:#E3ECFB; --engineering-soft:#E1F3E8; --design-soft:#FBEFD6; --pmm-soft:#F9E1F0; --program-soft:#E9E6F9;
  --org:#1B2430; --shadow:0 12px 32px rgba(27,36,48,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --surface:#1A1F27; --ink:#E8ECF2; --muted:#98A3B3; --line:#2B323D; --line-strong:#465064;
    --hover:#222936; --chip:#262D38;
    --product:#6D9BF0; --engineering:#5CC487; --design:#E7B24C; --pmm:#E56FB8; --program:#9B8DF0;
    --product-soft:#1F2C44; --engineering-soft:#1B3328; --design-soft:#3A2F17; --pmm-soft:#3B1F31; --program-soft:#28244A;
    --org:#E8ECF2; --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A1F27; --ink:#E8ECF2; --muted:#98A3B3; --line:#2B323D; --line-strong:#465064;
  --hover:#222936; --chip:#262D38;
  --product:#6D9BF0; --engineering:#5CC487; --design:#E7B24C; --pmm:#E56FB8; --program:#9B8DF0;
  --product-soft:#1F2C44; --engineering-soft:#1B3328; --design-soft:#3A2F17; --pmm-soft:#3B1F31; --program-soft:#28244A;
  --org:#E8ECF2; --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--product);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
.top-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.version{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;margin-top:8px;max-width:1400px;margin-inline:auto;overflow-x:auto}
.tab{padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tab:hover{color:var(--ink)}

main{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
.view[hidden]{display:none}
.intro{color:var(--muted);max-width:68ch;margin:0 0 14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toggle{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px}
.toggle input{margin:0}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
.swatch.c1{background:repeating-linear-gradient(135deg,var(--line-strong) 0 2px,transparent 2px 5px)}
.swatch.cm1{border:1.5px dashed var(--line-strong)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.org{background:var(--org)} .dot.build{background:var(--product)} .dot.team{background:var(--surface);border:2px solid var(--muted)} .dot.gate{background:var(--design);border-radius:2px;transform:rotate(45deg)} .dot.leadership{background:var(--org);border-radius:2px} .dot.gtm{background:var(--program)}

/* ---- cycle map ---- */
.map-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.map{min-width:1040px;padding:0 64px 12px 0}
.grid{display:grid;grid-template-columns:190px repeat(8,1fr);position:relative}
.phase-row .phase{grid-row:1;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);padding:12px 10px 4px;border-bottom:1px solid var(--line)}
.phase-row .phase.p2{border-left:1px solid var(--line-strong)}
.week-row .wk{padding:6px 10px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.week-row .wk.w3{border-left:1px solid var(--line-strong)}
.week-row .corner{border-bottom:1px solid var(--line)}
.ms-row{position:relative;height:72px;grid-column:1 / -1}
.ms-row.tall{height:112px}
.ms-track{position:absolute;left:190px;right:0;top:0;bottom:0}
.ms-track::after{content:"";position:absolute;left:0;right:0;bottom:0;border-bottom:1px solid var(--line)}
.ms{position:absolute;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:132px;text-align:center;font-size:11.5px;line-height:1.25;padding:4px 2px;border-radius:6px}
.ms{transition:transform .12s}
.ms .dot{width:12px;height:12px}
.ms .lbl{color:var(--ink);font-weight:500;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;display:inline-block}
.ms .lbl::after{content:" ›";opacity:.55}
.ms:hover .lbl,.ms:focus-visible .lbl{border-color:var(--line-strong);box-shadow:0 3px 10px rgba(27,36,48,.14)}
.ms.optional .lbl{color:var(--muted);font-weight:400;border-style:dashed}
.ms.stack-1{top:54px}
.ms.stack-1 .dot{display:none}
.ms.stack-2{top:100px}
.ms.stack-2 .dot{display:none}
.ms .lbl .cyc{color:var(--muted);font-weight:400}
.body{position:relative}
.lines{position:absolute;left:190px;right:0;top:0;bottom:0;pointer-events:none}
.line{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line)}
.line.ms-line{border-left:1.5px dashed var(--line-strong)}
.line.phase-line{border-left:1px solid var(--line-strong)}
.lane{display:grid;grid-template-columns:190px repeat(8,1fr);grid-auto-rows:minmax(48px,auto);border-top:1px solid var(--line);position:relative}
.lane + .lane{border-top:1px solid var(--line-strong)}
.lane-label{grid-row:1 / span 2;grid-column:1;padding:12px 12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:sticky;left:0;background:var(--surface);z-index:2}
.lane-label b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.lane-label b::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--lc)}
.lane-label .flag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lane-label .sum{font-size:11.5px;color:var(--muted);line-height:1.35;visibility:hidden}
.lane:hover .lane-label .sum,.lane:focus-within .lane-label .sum{visibility:visible}
.blk{margin:6px 4px;padding:8px 24px 8px 10px;border-radius:6px;font-size:12.5px;line-height:1.3;text-align:left;position:relative;z-index:1;min-height:36px;display:flex;align-items:flex-start;gap:6px;border:1px solid transparent;transition:box-shadow .12s,transform .12s}
.blk::after{content:"›";position:absolute;right:8px;top:6px;font-size:16px;line-height:1;opacity:.55;font-weight:400}
.blk:hover::after,.blk:focus-visible::after{opacity:1}
.blk.primary{background:var(--lc);color:#fff;font-weight:500}
.blk.secondary{background:var(--lsoft);color:var(--ink)}
.blk.c1{background:repeating-linear-gradient(135deg,var(--lsoft) 0 3px,var(--surface) 3px 7px);border-color:var(--lc);color:var(--ink);font-weight:500}
.blk.c1.secondary{font-weight:400;opacity:.9}
.blk.cm1{background:var(--surface);border:1.5px dashed var(--lc);color:var(--ink)}
.blk:hover{box-shadow:0 0 0 2px var(--lc) inset,0 4px 12px rgba(27,36,48,.18);transform:translateY(-1px)}
.blk.secondary:hover,.blk.c1:hover,.blk.cm1:hover{box-shadow:0 0 0 1.5px var(--lc) inset,0 4px 12px rgba(27,36,48,.14)}
.blk .cyc{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.08);white-space:nowrap;flex:none;margin-top:1px}
.blk.primary.c0 .cyc{display:none}
.blk.c1 .cyc,.blk.cm1 .cyc{background:var(--lc);color:#fff}
.blk.faded{opacity:.18;pointer-events:none}

/* artifacts */
.arts{margin-top:26px}
.arts h2,.section h2{font-size:15px;font-weight:600;margin:0 0 6px}
.arts .intro{margin-bottom:10px}
.art-grid{display:grid;grid-template-columns:190px repeat(8,1fr);border-top:1px solid var(--line);position:relative}
.art-row{display:contents}
.art-row .art-label{grid-column:1;padding:12px 26px 12px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px;position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;position:sticky;transition:background .12s}
.art-row .art-label::after{content:"›";position:absolute;right:10px;top:10px;font-size:16px;opacity:.55}
.art-row .art-label:hover{background:var(--hover)}
.art-row .art-label:hover::after{opacity:1}
.art-row .art-label b{display:block;font-weight:600}
.art-row .art-label span{color:var(--muted);font-size:11.5px}
.art-track{grid-column:2 / -1;position:relative;height:72px;border-bottom:1px solid var(--line)}
.art-bar{position:absolute;top:26px;height:3px;background:var(--line-strong);border-radius:2px}
.art-bar.c1{background:repeating-linear-gradient(90deg,var(--line-strong) 0 6px,transparent 6px 10px)}
.cp{position:absolute;top:20px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:92px}
.cp i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);display:block}
.cp.has-r i{background:var(--ink)}
.cp small{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.cp b{font-size:10.5px;font-weight:600;color:var(--ink);position:absolute;top:-16px;white-space:nowrap}
.art-after{display:inline-block;margin-top:4px;font-size:10.5px;color:var(--muted);background:var(--chip);padding:2px 6px;border-radius:3px}

.notes{margin-top:22px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.notes h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.notes ul{margin:0;padding-left:18px;color:var(--ink)}
.notes li{margin:3px 0}

/* ---- other views ---- */
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pick button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:500}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .dot{flex:none}
.card .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.card p{margin:6px 0}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:12.5px;margin-top:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.kv ul{margin:0;padding-left:16px}
.pill{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.pill.c1{border:1px solid var(--line-strong)}
.wk-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wk-lane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-top:3px solid var(--lc)}
.wk-lane h3{font-size:13.5px;margin:0 0 8px;font-weight:600}
.wk-lane .blk{margin:6px 0}
.bounds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.bound{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.bound h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.bound .ms-item{display:flex;gap:8px;align-items:flex-start;padding:8px 26px 8px 6px;border-top:1px solid var(--line);text-align:left;width:100%;position:relative;border-radius:6px}
.bound .ms-item::after{content:"›";position:absolute;right:10px;top:8px;font-size:16px;opacity:.55}
.bound .ms-item:hover{background:var(--hover)}
.bound .ms-item:first-of-type{border-top:0}
.bound .ms-item b{font-weight:500}
.bound .ms-item small{color:var(--muted);display:block}
.empty{color:var(--muted);font-size:12.5px}
.fn-weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:16px}
.fn-week{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:120px}
.fn-week .wkh{font-size:11px;color:var(--muted);margin-bottom:6px}
.fn-week .blk{margin:4px 0;font-size:12px}
.fn-week .msdot{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.fn-week .msdot span{font-size:10.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.fn-ms{margin-top:8px}
.fn-summary{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lc);border-radius:10px;padding:12px 16px;margin-bottom:14px;max-width:70ch}
.fn-summary p{margin:0;color:var(--ink)}

/* drawer */
.drawer{position:fixed;top:env(safe-area-inset-top,0px);right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(100%);transition:transform .2s ease}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.blk,.ms,.art-label{transition:none}.blk:hover{transform:none}}
.drawer .close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:6px;font-size:18px;color:var(--muted)}
.drawer .close:hover{background:var(--hover)}
.drawer .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:6px}
.drawer h2{font-size:17px;margin:0 0 8px;font-weight:600;text-wrap:balance;padding-right:30px}
.drawer p{margin:8px 0;max-width:60ch}
.drawer .kv{grid-template-columns:86px 1fr}
.scrim{position:fixed;inset:0;z-index:19;display:none}
.scrim.open{display:block}

@media (max-width:640px){
  .bounds{grid-template-columns:1fr}
  .fn-weeks{grid-template-columns:repeat(2,1fr)}
}
</style>

<header class="top">
  <div class="top-row">
    <h1>Jam Cycle Map</h1>
    <span class="version mono" id="version"></span>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-view="cycle" aria-selected="true">The cycle</button>
    <button class="tab" role="tab" data-view="week" aria-selected="false">This week</button>
    <button class="tab" role="tab" data-view="function" aria-selected="false">By function</button>
    <button class="tab" role="tab" data-view="milestones" aria-selected="false">Milestones</button>
    <button class="tab" role="tab" data-view="artifacts" aria-selected="false">Documents</button>
  </nav>
</header>

<main>
  <section class="view" id="view-cycle">
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="show-c0" checked> <span class="swatch" style="background:var(--product)"></span> This cycle</label>
      <label class="toggle"><input type="checkbox" id="show-c1" checked> <span class="swatch c1"></span> Next-cycle prep (+1)</label>
      <label class="toggle"><input type="checkbox" id="show-cm1" checked> <span class="swatch cm1"></span> Prior-cycle close-out (−1)</label>
      <div class="legend">
        <span class="k"><i class="dot org"></i>Whole company</span>
        <span class="k"><i class="dot build"></i>Build Org</span>
        <span class="k"><i class="dot team"></i>Team or pod</span>
        <span class="k"><i class="dot leadership"></i>Leadership</span>
        <span class="k"><i class="dot gate"></i>Decision</span>
        <span class="k"><i class="dot gtm"></i>CS &amp; Sales</span>
      </div>
    </div>
    <div class="map-wrap"><div class="map" id="map"></div></div>

    <div class="arts">
      <h2>Documents across the cycle</h2>
      <div class="map-wrap"><div class="map" id="artmap"></div></div>
    </div>

    <div class="notes" id="notes"></div>
  </section>

  <section class="view" id="view-week" hidden>
    <div class="pick" id="week-pick"></div>
    <div id="week-body"></div>
  </section>

  <section class="view" id="view-function" hidden>
    <div class="pick" id="fn-pick"></div>
    <div class="map-wrap"><div class="map" id="fn-map"></div></div>
  </section>

  <section class="view" id="view-milestones" hidden>
    <div class="cards" id="ms-cards"></div>
  </section>

  <section class="view" id="view-artifacts" hidden>
    <div class="cards" id="art-cards"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite">
  <button class="close" id="drawer-close" aria-label="Close">×</button>
  <div id="drawer-body"></div>
</aside>

rn the problem space into an implementation plan. Sessions are pod plus PM. Ends with the Engineering Pitch-back."}, {"lane": "product", "weeks": [1, 2], "layer": "secondary", "cycle": -1, "title": "Finish prior-cycle Launch Brief and Walkthrough/FAQ to 100%", "detail": "New. After Engineering Demo Day the docs are around 80%. Weeks 1 and 2 bring them to complete, with the shipped behavior confirmed, so they can live in the repository of what is coming out."}, {"lane": "product", "weeks": [3, 6], "layer": "primary", "cycle": 1, "title": "Shape and rank next-cycle opportunities", "detail": "Discovery with customers, internal stakeholders and data. Pitch Discovery sessions bring relevant people in early. PM team sessions refine and challenge ideas, then decide what goes to Portfolio Review and in what order (ranked 1 to 20). Finalize pitches before the review."}, {"lane": "product", "weeks": [3, 6], "layer": "secondary", "cycle": 0, "title": "Keep the ledger current; feed the Launch Brief and Walkthrough/FAQ", "detail": "Product maintains the Product Delivery Ledger item for each committed piece of work and contributes product truth to the downstream documents as delivery gets more precise."}, {"lane": "product", "weeks": [7, 8], "layer": "primary", "cycle": 1, "title": "Opportunity intake with pod leads (forecast)", "detail": "After Portfolio Review the engineering, design and product leads for each pod take a first pass at the opportunities the pod forecast it will pick up. Product is not in the pod; it joins when one of its items is picked. This is a surface to test whether anything would stop this becoming the official plan."}, {"lane": "product", "weeks": [7, 8], "layer": "secondary", "cycle": 0, "title": "Enablement sessions; docs to about 80%", "detail": "Present alongside Program at the two enablement sessions. Confirm what is in production versus still building."}, {"lane": "engineering", "weeks": [1, 2], "layer": "primary", "cycle": 0, "title": "Cooldown and ramp-up", "detail": "Self-led. Cooldown is whatever gets the team refreshed: tech debt, a retro, a half day off. Ramp-up is planning with the PM, breaking down the opportunity, and writing the implementation plan. The one thing that must be true at the end: an implementation plan Product is aligned with."}, {"lane": "engineering", "weeks": [3, 8], "layer": "primary", "cycle": 0, "title": "Focused delivery", "detail": "Protected build time. Make progress visible early, test assumptions while change is still possible, push meaningful changes into the ledger before they become surprises. Ends with a shipped increment and Engineering Demo Day."}, {"lane": "engineering", "weeks": [7, 8], "layer": "secondary", "cycle": 1, "title": "Opportunity intake (engineering lead)", "detail": "The pod's engineering lead joins the product and design leads for a first pass at the forecast opportunities. Secondary to delivery."}, {"lane": "design", "weeks": [1, 2], "layer": "primary", "cycle": 0, "title": "Design V1", "detail": "First version of the designs for the selected opportunity, in parallel with pod refinement."}, {"lane": "design", "weeks": [1, 2], "layer": "secondary", "cycle": 0, "title": "Refine with the pod and PM", "detail": "Design takes part in pod refinement sessions and the Pitch-back so the implementation plan and the design direction agree."}, {"lane": "design", "weeks": [3, 4], "layer": "primary", "cycle": 0, "title": "Iterate, align, test", "detail": "Iterate on V1, align with the pod and design leadership, test with users. Design Share-outs at the end of week 3, Design Demo Day at the end of week 4."}, {"lane": "design", "weeks": [5, 6], "layer": "primary", "cycle": 0, "title": "Iterate, harden, hand off", "detail": "Take the direction the pod landed on and make it ready: edge cases, states, handoff to engineering."}, {"lane": "design", "weeks": [7, 8], "layer": "primary", "cycle": 1, "title": "Opportunity intake (design lead)", "detail": "The pod's design lead joins the first pass at the forecast opportunities for next cycle."}, {"lane": "design", "weeks": [7, 8], "layer": "secondary", "cycle": 0, "title": "Support delivery; release QA in week 8", "detail": "Answer build questions and, in the final week, QA what is about to release: what needs cleaning up before we are ready to go."}, {"lane": "pmm", "weeks": [1, 2], "layer": "primary", "cycle": 0, "title": "Discuss proposed launch tiers", "detail": "Tiers were proposed right after Portfolio Review. Weeks 1 and 2 are for conversation about what a Tier 1, 2 or 3 means for storytelling and strategy, a full eight weeks before release."}, {"lane": "pmm", "weeks": [1, 2], "layer": "secondary", "cycle": -1, "title": "Release notes and launch comms for shipped work", "detail": "Work that landed on time rides this release: release notes and initial launch communications. Work that did not rolls to the next cycle's launch."}, {"lane": "pmm", "weeks": [3, 4], "layer": "primary", "cycle": 0, "title": "Confirm launch tier; open the Launch Brief", "detail": "By the end of week 3 the shape of the solution is known well enough to confirm the tier and draft the launch language."}, {"lane": "pmm", "weeks": [5, 6], "layer": "primary", "cycle": 0, "title": "Product messaging framework (Tier 1 and 2)", "detail": "Positioning, narrative, proof and what not to overstate, captured in the Launch Brief."}, {"lane": "pmm", "weeks": [7, 8], "layer": "primary", "cycle": 0, "title": "Launch timing, GTM plan, packaging and pricing", "detail": "Finalize the plan for bringing the work to market alongside the enablement sessions."}, {"lane": "pmm", "weeks": [7, 8], "layer": "secondary", "cycle": 1, "title": "Propose launch tiers for next cycle", "detail": "Right after Portfolio Review, propose a tier for each confirmed opportunity so the conversation can start early."}, {"lane": "program", "weeks": [1, 2], "layer": "primary", "cycle": 0, "title": "Inspect what we expect: every pod has PM sessions, Big Room Planning and a Pitch-back", "detail": "Teams plan however they want, but each pod either has these in place or can say why they are unnecessary. Ends by opening the Launch Brief and Walkthrough/FAQ drafts at Delivery Kickoff."}, {"lane": "program", "weeks": [1, 2], "layer": "secondary", "cycle": -1, "title": "Close out prior-cycle enablement docs to 100%", "detail": "Coordinate the last 20% with Product, PMM and CS/Sales owners now that the work has shipped."}, {"lane": "program", "weeks": [3, 4], "layer": "primary", "cycle": 0, "title": "Progress the drafts; add the Design Demo Day recording", "detail": "Each org-wide moment gets recorded and added to the Launch Brief and Walkthrough/FAQ so they build up over the cycle."}, {"lane": "program", "weeks": [5, 6], "layer": "primary", "cycle": 0, "title": "Prepare enablement; optional early session", "detail": "Sessions can happen any time after Design Demo Day. Some cycles have one at the start of week 6 or even week 4."}, {"lane": "program", "weeks": [7, 8], "layer": "primary", "cycle": 0, "title": "Run enablement sessions; docs to about 80%", "detail": "Sessions at the start of week 7 and week 8 bring the full CS and Sales teams through what is coming. Recorded and added to the docs. We call the business enabled at this point even though the final version is not yet in production."}, {"lane": "program", "weeks": [3, 8], "layer": "secondary", "cycle": 0, "title": "System health: ledger, change notices, checkpoints", "detail": "Keep cadence, escalation paths and cross-functional clarity working. Hidden change is the failure mode, not change."}], "milestones": [{"id": "kickoff", "at": 0, "name": "Jam Session Kickoff", "kind": "org", "cycle": 0, "owner": "Product", "audience": "Full organization, especially the Build Org", "inputs": ["Finalized opportunity pitches", "Product strategy and tactics"], "outputs": ["Cycle formally begins", "Shared view of strategy and the selected work"], "detail": "Opens the cycle. Happens at the same boundary as the prior cycle's Engineering Demo Day and cycle close."}, {"id": "brp", "at": 1, "name": "Engineering Big Room Planning", "kind": "team", "cycle": 0, "owner": "Engineering leaders", "audience": "Engineering leaders", "inputs": ["Each pod's early thinking after first sessions with the PM"], "outputs": ["Risks, dependencies and opportunities surfaced", "Plans pressure-tested with peers"], "detail": "A sounding board at the end of week 1. Requires that initial conversations with Product have already happened."}, {"id": "pitchback", "at": 2, "name": "Engineering Pitch-back", "kind": "team", "cycle": 0, "owner": "The pod", "audience": "Pod, PM and Design (one per pod)", "inputs": ["Draft implementation plan (Pod Delivery Plan)"], "outputs": ["Implementation plan aligned with Product", "Ready for delivery"], "detail": "The checkpoint that says planning is done. Every pod has one unless there is a reason it does not make sense."}, {"id": "delivery-kickoff", "at": 2, "name": "Delivery Kickoff", "kind": "build", "cycle": 0, "owner": "Engineering teams and pods present", "audience": "Full Build Org plus key stakeholders; anyone welcome", "inputs": ["Implementation plans aligned at Pitch-back"], "outputs": ["Aligned Build Org and stakeholders", "Launch Brief and Walkthrough/FAQ drafts opened", "Ledger items created"], "detail": "Celebrates the end of planning and tells everyone what we are going for. First point where the downstream documents exist."}, {"id": "shareouts", "at": 3, "name": "Design Share-outs", "kind": "team", "cycle": 0, "owner": "Design", "audience": "Pod plus design leadership; sometimes business stakeholders", "inputs": ["Iterated designs"], "outputs": ["Confirmation the design is on track with the Build Org"], "detail": ""}, {"id": "tiers", "at": 3, "name": "Confirm Launch Tiers", "kind": "gate", "cycle": 0, "owner": "Product Marketing with Product", "audience": "PMM, Product, Program", "inputs": ["Proposed tiers", "Shape of the solution from planning"], "outputs": ["Tier confirmed per project (target 100%)", "Launch language drafted"], "detail": "We do not know exactly what is coming, but we know the shape of it and how big a deal to make of it."}, {"id": "design-demo", "at": 4, "name": "Design Demo Day", "kind": "org", "cycle": 0, "owner": "Design leaders", "audience": "Full organization", "inputs": ["V1 concepts, research and findings"], "outputs": ["Recording, added to the Launch Brief and Walkthrough/FAQ", "Business can see and touch the direction"], "detail": "Midpoint of the cycle. First time the wider business sees the product taking shape."}, {"id": "enable-early", "at": 5, "name": "Enablement Session (optional, early)", "kind": "gtm", "cycle": 0, "status": "optional", "owner": "Program with Product", "audience": "CS and Sales", "inputs": ["Current docs and demos"], "outputs": ["Earlier readiness where the work allows it"], "detail": "Some cycles run an extra session at the start of week 6 or week 4. Any time after Design Demo Day works."}, {"id": "portfolio", "at": 6, "name": "Portfolio Review", "kind": "leadership", "cycle": 1, "owner": "Product", "audience": "Executive team, extended leadership and key stakeholders; all PMs present and presenting", "inputs": ["Finalized, ranked opportunity pitches"], "outputs": ["Confirmed, ranked list of work for next cycle"], "detail": "The business says yes or no, with conversation where needed. Everything downstream for next cycle keys off this."}, {"id": "select", "at": 6, "name": "Pods Select Pitches (forecast)", "kind": "gate", "cycle": 1, "owner": "Engineering leaders", "audience": "Pod leads and Product", "inputs": ["Confirmed ranked list"], "outputs": ["Forecast of what each pod will take on", "Start of opportunity intake"], "detail": "A forecast, not a commitment. The whole team is not present and we are still building."}, {"id": "enable-1", "at": 6, "name": "Enablement Session 1", "kind": "gtm", "cycle": 0, "owner": "Program with Product", "audience": "Full CS and Sales teams", "inputs": ["Launch Brief and Walkthrough/FAQ drafts", "Demos of work in progress"], "outputs": ["Recording added to docs", "Business about 80% enabled"], "detail": "Start of week 7."}, {"id": "enable-2", "at": 7, "name": "Enablement Session 2", "kind": "gtm", "cycle": 0, "owner": "Program with Product", "audience": "Full CS and Sales teams", "inputs": ["Updated docs and demos"], "outputs": ["Recording added to docs", "Business considered enabled"], "detail": "Start of week 8. Not 100% because the final version is not in production and the docs are partial."}, {"id": "eng-demo", "at": 8, "name": "Engineering Demo Day", "kind": "org", "cycle": 0, "owner": "Engineering leader; teams present", "audience": "Full organization", "inputs": ["What the pods delivered"], "outputs": ["Recording", "Cycle closes; next cycle opens with Jam Session Kickoff"], "detail": "Celebratory show and tell. Closes the org-wide alignment arc: Kickoff explained the strategy, Design Demo Day showed the shape, Engineering Demo Day shows what is real."}], "artifacts": [{"id": "opportunity", "name": "Opportunity", "owner": "Product", "cycle": 1, "purpose": "Product's way of pitching work: a constrained problem space leadership can evaluate and pods can shape.", "checkpoints": [{"at": 2, "label": "Shaping begins"}, {"at": 5, "label": "Pitches finalized"}, {"at": 6, "label": "Confirmed at Portfolio Review"}]}, {"id": "plan", "name": "Pod Delivery Plan (implementation plan)", "owner": "Pod, led by Engineering", "cycle": 0, "purpose": "The pod's way of confirming its plan: chosen approach, intended increment, scope, cut lines, risks.", "checkpoints": [{"at": 1, "label": "First pass at Big Room Planning"}, {"at": 2, "label": "Aligned with Product at Pitch-back"}]}, {"id": "launch-brief", "name": "Launch Brief", "owner": "Product Marketing, with Product", "cycle": 0, "purpose": "How to talk about the work: audience, positioning, what not to overstate, launch posture.", "checkpoints": [{"at": 2, "label": "Draft opened", "readiness": "Draft"}, {"at": 3, "label": "Tier confirmed", "readiness": "Tier 100%"}, {"at": 4, "label": "Design Demo added"}, {"at": 6, "label": "Enablement 1", "readiness": "~80%"}, {"at": 7, "label": "Enablement 2", "readiness": "~80%"}], "after": "100% by week 2 of next cycle"}, {"id": "faq", "name": "Feature Walkthrough & FAQ", "owner": "CS / Sales / Support owner, with Product", "cycle": 0, "purpose": "How the delivered experience actually works, its limits, and how to demo, support and answer questions.", "checkpoints": [{"at": 2, "label": "Draft opened", "readiness": "Draft"}, {"at": 4, "label": "Design Demo added"}, {"at": 6, "label": "Enablement 1", "readiness": "~80%"}, {"at": 7, "label": "Enablement 2", "readiness": "~80%"}], "after": "100% by week 2 of next cycle"}], "notes": ["Pitch Reactor has been removed.", "The monthly CS Listening Session runs the second Friday of each month, which does not map to cycle weeks, so it is not shown.", "Only whole-company, Build Org, leadership and CS & Sales moments are drawn. Team and pod sessions remain in the data, hidden.", "Opportunity + Pitch Collab in the old diagram is now simply Opportunity intake (weeks 7 and 8).", "Readiness percentages (80% at enablement, tier 100% by week 3) are provisional targets.", "Product Marketing's lane and the post-cycle PMM work (release notes, launch comms) are placeholders pending definition.", "Closing the prior cycle's docs to 100% in weeks 1 and 2 is new and not in the Notion pages yet.", "Engineering Big Room Planning at the end of week 1 was missing from the Figma; it is in the data as a hidden team session.", "Draft 4: Product Delivery Ledger removed from the documents view; it is a live view of the opportunity list, not a document with its own progression."]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const W = D.meta.cycleWeeks;
const laneById = Object.fromEntries(D.lanes.map(l=>[l.id,l]));
const KIND_LABEL = {org:'Whole company', build:'Build Org', team:'Team or pod', gate:'Decision', leadership:'Leadership', gtm:'CS & Sales'};
const cycClass = c => c===1?'c1':c===-1?'cm1':'c0';
const cycLabel = c => c===1?'+1':c===-1?'−1':'';
const cycName = c => c===1?D.meta.legend.cycle1:c===-1?D.meta.legend.cycleMinus1:D.meta.legend.cycle0;
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pct = b => (b/W*100)+'%';
const boundaryName = b => b===0?'Start of week 1':b===W?'End of week '+W:'End of week '+b+' / start of week '+(b+1);

document.getElementById('version').textContent = D.meta.version;

/* ---------- cycle map ---------- */
const VIS = new Set(D.meta.visibleKinds || ['org','build','team','gate','leadership','gtm']);
const visibleMs = D.milestones.filter(m=>m.at!==null && VIS.has(m.kind));

function laneMapHTML(lanes){
  let h = '';
  h += '<div class="grid phase-row"><div class="phase"></div>';
  D.meta.phases.forEach((p,i)=>{ const span=p.weeks[1]-p.weeks[0]+1; h+=`<div class="phase ${i>0?'p2':''}" style="grid-column:span ${span}">${esc(p.name)} · ${span} wk</div>`; });
  h += '</div>';
  h += '<div class="grid week-row"><div class="corner"></div>';
  for(let w=1;w<=W;w++) h += `<div class="wk mono ${w===3?'w3':''}">Week ${w}</div>`;
  h += '</div>';
  const byAt = {};
  visibleMs.forEach(m=>{ (byAt[m.at]=byAt[m.at]||[]).push(m); });
  const maxStack = Math.max(1, ...Object.values(byAt).map(l=>l.length));
  h += `<div class="grid"><div class="ms-row ${maxStack>1?'tall':''}"><div class="ms-track">`;
  Object.entries(byAt).forEach(([at,list])=>{
    list.forEach((m,i)=>{
      h += `<button class="ms stack-${i} ${m.status==='optional'?'optional':''}" style="left:${pct(+at)}" data-ms="${m.id}" title="${esc(m.name)}"><i class="dot ${m.kind}"></i><span class="lbl">${esc(m.name)}${m.cycle===1?' <span class="cyc">(+1)</span>':''}</span></button>`;
    });
  });
  h += '</div></div></div>';
  h += '<div class="body"><div class="lines">';
  for(let b=1;b<W;b++){
    const isMs = visibleMs.some(m=>m.at===b);
    h += `<div class="line ${b===2?'phase-line':''} ${isMs?'ms-line':''}" style="left:${pct(b)}"></div>`;
  }
  h += '</div>';
  lanes.forEach(l=>{
    h += `<div class="lane" style="--lc:var(--${l.color});--lsoft:var(--${l.color}-soft)">`;
    h += `<div class="lane-label"><b>${esc(l.name)}</b>${l.flag?`<span class="flag">${esc(l.flag)}</span>`:''}<span class="sum">${esc(l.summary)}</span></div>`;
    D.activities.map((a,i)=>({a,i})).filter(x=>x.a.lane===l.id).forEach(({a,i})=>{
      const row = a.layer==='primary'?1:2;
      h += `<button class="blk ${a.layer} ${cycClass(a.cycle)}" style="grid-row:${row};grid-column:${a.weeks[0]+1} / ${a.weeks[1]+2}" data-act="${i}">${a.cycle!==0?`<span class="cyc">${cycLabel(a.cycle)}</span>`:''}<span>${esc(a.title)}</span></button>`;
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function buildMap(){
  document.getElementById('map').innerHTML = laneMapHTML(D.lanes);

  const am = document.getElementById('artmap');
  let g = '<div class="grid week-row"><div class="corner"></div>';
  for(let w=1;w<=W;w++) g += `<div class="wk mono ${w===3?'w3':''}">Week ${w}</div>`;
  g += '</div><div class="art-grid">';
  D.artifacts.forEach((a,i)=>{
    const cps = a.checkpoints;
    const from = Math.min(...cps.map(c=>c.at)), to = Math.max(...cps.map(c=>c.at));
    g += `<div class="art-row"><button class="art-label" data-art="${i}"><b>${esc(a.name)}</b><span>${esc(a.owner)}</span>${a.after?`<span class="art-after">→ ${esc(a.after)}</span>`:''}</button><div class="art-track">`;
    g += `<div class="art-bar ${a.cycle===1?'c1':''}" style="left:${pct(from)};width:calc(${pct(to)} - ${pct(from)})"></div>`;
    cps.forEach(c=>{
      g += `<div class="cp ${c.readiness?'has-r':''}" style="left:${pct(c.at)}">${c.readiness?`<b>${esc(c.readiness)}</b>`:''}<i></i><small>${esc(c.label)}</small></div>`;
    });
    g += '</div></div>';
  });
  g += '</div>';
  am.innerHTML = g;

  const notesEl = document.getElementById('notes');
  if(D.meta.showNotes && D.notes && D.notes.length){ notesEl.innerHTML = `<h2>Notes and recent changes</h2><ul>${D.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`; } else { notesEl.hidden = true; }
}

function applyFilters(){
  const show = {c0:document.getElementById('show-c0').checked, c1:document.getElementById('show-c1').checked, cm1:document.getElementById('show-cm1').checked};
  document.querySelectorAll('#map .blk').forEach(b=>{
    const c = b.classList.contains('c1')?'c1':b.classList.contains('cm1')?'cm1':'c0';
    b.classList.toggle('faded', !show[c]);
  });
}

/* ---------- drawer ---------- */
const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim'), dbody = document.getElementById('drawer-body');
function openDrawer(html){ dbody.innerHTML = html; drawer.classList.add('open'); scrim.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }
document.getElementById('drawer-close').onclick = closeDrawer; scrim.onclick = closeDrawer;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

function list(arr){ return arr && arr.length ? `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '<span class="empty">None recorded</span>'; }

function msHTML(m){
  const where = m.at===null ? (m.status==='recurring'?'Recurring':'Unplaced') : boundaryName(m.at);
  return `<div class="eyebrow"><i class="dot ${m.kind}"></i>${KIND_LABEL[m.kind]||m.kind}${m.status?` · <span class="pill">${esc(m.status)}</span>`:''}${m.cycle===1?` · <span class="pill c1">for next cycle</span>`:''}</div>
  <h2>${esc(m.name)}</h2>
  <p class="meta mono" style="color:var(--muted);font-size:12px">${where}</p>
  ${m.detail?`<p>${esc(m.detail)}</p>`:''}
  <dl class="kv"><dt>Owner</dt><dd>${esc(m.owner)}</dd><dt>Who attends</dt><dd>${esc(m.audience)}</dd><dt>Inputs</dt><dd>${list(m.inputs)}</dd><dt>Outputs</dt><dd>${list(m.outputs)}</dd></dl>`;
}
function actHTML(a){
  const l = laneById[a.lane];
  const wk = a.weeks[0]===a.weeks[1]?`Week ${a.weeks[0]}`:`Weeks ${a.weeks[0]}–${a.weeks[1]}`;
  return `<div class="eyebrow"><span class="swatch" style="background:var(--${l.color})"></span>${esc(l.name)} · ${a.layer} focus · <span class="pill ${cycClass(a.cycle)}">${esc(cycName(a.cycle))}</span></div>
  <h2>${esc(a.title)}</h2><p class="mono" style="color:var(--muted);font-size:12px">${wk}</p><p>${esc(a.detail)}</p>`;
}
function artHTML(a){
  return `<div class="eyebrow">Document${a.cycle===1?' · <span class="pill c1">for next cycle</span>':''}</div><h2>${esc(a.name)}</h2>
  <p>${esc(a.purpose)}</p><dl class="kv"><dt>Owner</dt><dd>${esc(a.owner)}</dd><dt>Progression</dt><dd><ul>${a.checkpoints.map(c=>`<li>${boundaryName(c.at)}: ${esc(c.label)}${c.readiness?` <b>(${esc(c.readiness)})</b>`:''}</li>`).join('')}${a.after?`<li>${esc(a.after)}</li>`:''}</ul></dd></dl>`;
}

document.addEventListener('click', e=>{
  const ms = e.target.closest('[data-ms]'); if(ms){ openDrawer(msHTML(D.milestones.find(m=>m.id===ms.dataset.ms))); return; }
  const act = e.target.closest('[data-act]'); if(act){ openDrawer(actHTML(D.activities[+act.dataset.act])); return; }
  const art = e.target.closest('[data-art]'); if(art){ openDrawer(artHTML(D.artifacts[+art.dataset.art])); return; }
});

/* ---------- this week ---------- */
let curWeek = 1, curFn = D.lanes[0].id;
function blkBtn(a, i){ return `<button class="blk ${a.layer} ${cycClass(a.cycle)}" data-act="${i}">${a.cycle!==0?`<span class="cyc">${cycLabel(a.cycle)}</span>`:''}<span>${esc(a.title)}</span></button>`; }
function msItem(m){ return `<button class="ms-item" data-ms="${m.id}"><i class="dot ${m.kind}" style="margin-top:4px;flex:none"></i><span><b>${esc(m.name)}</b>${m.cycle===1?' <span class="pill c1">+1</span>':''}<small>${esc(m.owner)} → ${esc(m.audience)}</small></span></button>`; }
function buildWeek(){
  document.getElementById('week-pick').innerHTML = Array.from({length:W},(_,i)=>`<button aria-pressed="${i+1===curWeek}" data-week="${i+1}">Week ${i+1}</button>`).join('');
  const opens = visibleMs.filter(m=>m.at===curWeek-1), closes = visibleMs.filter(m=>m.at===curWeek);
  const phase = D.meta.phases.find(p=>curWeek>=p.weeks[0]&&curWeek<=p.weeks[1]);
  let h = `<p class="intro"><b>Week ${curWeek}</b> · ${esc(phase.name)}</p>`;
  h += `<div class="bounds"><div class="bound"><h3>Opens the week</h3>${opens.length?opens.map(msItem).join(''):'<span class="empty">No milestone</span>'}</div><div class="bound"><h3>Closes the week</h3>${closes.length?closes.map(msItem).join(''):'<span class="empty">No milestone</span>'}</div></div>`;
  h += '<div class="wk-cols">';
  D.lanes.forEach(l=>{
    const acts = D.activities.map((a,i)=>({a,i})).filter(x=>x.a.lane===l.id && curWeek>=x.a.weeks[0] && curWeek<=x.a.weeks[1]).sort((x,y)=>(x.a.layer==='primary'?0:1)-(y.a.layer==='primary'?0:1));
    h += `<div class="wk-lane" style="--lc:var(--${l.color});--lsoft:var(--${l.color}-soft)"><h3>${esc(l.name)}</h3>${acts.length?acts.map(x=>blkBtn(x.a,x.i)).join(''):'<span class="empty">Nothing scheduled</span>'}</div>`;
  });
  h += '</div>';
  document.getElementById('week-body').innerHTML = h;
}
document.getElementById('week-pick').addEventListener('click', e=>{ const b=e.target.closest('[data-week]'); if(b){ curWeek=+b.dataset.week; buildWeek(); } });

/* ---------- by function ---------- */
function buildFn(){
  document.getElementById('fn-pick').innerHTML = D.lanes.map(l=>`<button aria-pressed="${l.id===curFn}" data-fn="${l.id}">${esc(l.name)}</button>`).join('');
  const l = laneById[curFn];
  document.getElementById('fn-map').innerHTML = laneMapHTML([l]);
}
document.getElementById('fn-pick').addEventListener('click', e=>{ const b=e.target.closest('[data-fn]'); if(b){ curFn=b.dataset.fn; buildFn(); } });

/* ---------- milestones & artifacts ---------- */
function msCard(m){
  const where = m.at===null ? (m.status==='recurring'?'Recurring, about twice a cycle':'Not placed') : boundaryName(m.at);
  return `<div class="card"><h3><i class="dot ${m.kind}"></i>${esc(m.name)}${m.status?`<span class="pill">${esc(m.status)}</span>`:''}${m.cycle===1?`<span class="pill c1">+1</span>`:''}</h3>
  <div class="meta mono">${where} · ${KIND_LABEL[m.kind]||m.kind}</div>
  ${m.detail?`<p>${esc(m.detail)}</p>`:''}
  <dl class="kv"><dt>Owner</dt><dd>${esc(m.owner)}</dd><dt>Who attends</dt><dd>${esc(m.audience)}</dd><dt>Inputs</dt><dd>${list(m.inputs)}</dd><dt>Outputs</dt><dd>${list(m.outputs)}</dd></dl></div>`;
}
function buildMilestones(){
  const sorted = [...visibleMs].sort((a,b)=>a.at-b.at);
  document.getElementById('ms-cards').innerHTML = sorted.map(msCard).join('');
}
function buildArtifacts(){
  document.getElementById('art-cards').innerHTML = D.artifacts.map(a=>`<div class="card"><h3>${esc(a.name)}${a.cycle===1?`<span class="pill c1">+1</span>`:''}</h3><div class="meta">${esc(a.owner)}</div><p>${esc(a.purpose)}</p>
  <dl class="kv"><dt>Progression</dt><dd><ul>${a.checkpoints.map(c=>`<li>${boundaryName(c.at)}: ${esc(c.label)}${c.readiness?` <b>(${esc(c.readiness)})</b>`:''}</li>`).join('')}${a.after?`<li>${esc(a.after)}</li>`:''}</ul></dd></dl></div>`).join('');
}

/* ---------- tabs ---------- */
document.getElementById('tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===t));
  document.querySelectorAll('.view').forEach(v=>v.hidden = v.id !== 'view-'+t.dataset.view);
  try{ localStorage.setItem('jam-view', t.dataset.view); }catch(_){}
});
['show-c0','show-c1','show-cm1'].forEach(id=>document.getElementById(id).addEventListener('change', applyFilters));
document.querySelectorAll('.legend .k').forEach(k=>{ const kind=[...k.querySelector('.dot').classList].find(c=>c!=='dot'); if(!VIS.has(kind)) k.remove(); });

buildMap(); buildWeek(); buildFn(); buildMilestones(); buildArtifacts();
try{ const v = localStorage.getItem('jam-view'); const t = v && document.querySelector(`.tab[data-view="${v}"]`); if(t) t.click(); }catch(_){}
</script>
