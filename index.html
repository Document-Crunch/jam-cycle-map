<meta charset="utf-8">
<title>Jam Cycle Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F7FA; --surface:#FFFFFF; --ink:#1B2430; --muted:#5C6878; --line:#DCE1E9; --line-strong:#B9C2CF;
  --hover:#EEF1F6; --chip:#E9EDF3;
  --product:#2F6FDB; --engineering:#2E9E5B; --design:#D9961F; --pmm:#CF3F97; --program:#6B5BD2;
  --product-soft:#E3ECFB; --engineering-soft:#E1F3E8; --design-soft:#FBEFD6; --pmm-soft:#F9E1F0; --program-soft:#E9E6F9;
  --org:#1B2430; --build:#0E7C86; --shadow:0 12px 32px rgba(27,36,48,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --surface:#1A1F27; --ink:#E8ECF2; --muted:#98A3B3; --line:#2B323D; --line-strong:#465064;
    --hover:#222936; --chip:#262D38;
    --product:#6D9BF0; --engineering:#5CC487; --design:#E7B24C; --pmm:#E56FB8; --program:#9B8DF0;
    --product-soft:#1F2C44; --engineering-soft:#1B3328; --design-soft:#3A2F17; --pmm-soft:#3B1F31; --program-soft:#28244A;
    --org:#E8ECF2; --build:#3FB8C4; --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A1F27; --ink:#E8ECF2; --muted:#98A3B3; --line:#2B323D; --line-strong:#465064;
  --hover:#222936; --chip:#262D38;
  --product:#6D9BF0; --engineering:#5CC487; --design:#E7B24C; --pmm:#E56FB8; --program:#9B8DF0;
  --product-soft:#1F2C44; --engineering-soft:#1B3328; --design-soft:#3A2F17; --pmm-soft:#3B1F31; --program-soft:#28244A;
  --org:#E8ECF2; --build:#3FB8C4; --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--product);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
.top-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.version{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;margin-top:8px;max-width:1400px;margin-inline:auto;overflow-x:auto}
.tab{padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tab:hover{color:var(--ink)}

main{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
.view[hidden]{display:none}
.intro{color:var(--muted);max-width:68ch;margin:0 0 14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.controls.groups{gap:8px;margin-bottom:16px}
.controls.groups .toggle .dot{flex:none}
.ctl-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px}
.toggle input{margin:0}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
.swatch.c1{background:repeating-linear-gradient(135deg,var(--line-strong) 0 2px,transparent 2px 5px)}
.swatch.cm1{border:1.5px dashed var(--line-strong)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.org{background:var(--org)}
.dot.build{background:var(--build);border-radius:3px}
.dot.leadership{background:var(--org);border-radius:2px}
.dot.gtm{background:var(--program)}
.dot.product{background:var(--product)}
.dot.design{background:var(--design)}
.dot.engineering{background:var(--engineering)}
.dot.team{background:var(--surface);border:2px solid var(--muted)}
.dot.gate{background:var(--design);border-radius:2px;transform:rotate(45deg)}

/* ---- cycle map ---- */
.map-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.map{min-width:920px;padding:0 calc((100% - 190px) / 17) 12px 0}
.grid{display:grid;grid-template-columns:190px repeat(8,1fr);position:relative}
.phase-row .phase{grid-row:1;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);padding:12px 10px 4px;border-bottom:1px solid var(--line)}
.phase-row .phase.p2{border-left:1px solid var(--line-strong)}
.week-row .wk{padding:6px 10px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.week-row .wk.w3{border-left:1px solid var(--line-strong)}
.week-row .corner{border-bottom:1px solid var(--line)}
.ms-row{position:relative;height:72px;grid-column:1 / -1}
.ms-track{position:absolute;left:190px;right:0;top:0;bottom:0}
.ms-track::after{content:"";position:absolute;left:0;right:0;bottom:0;border-bottom:1px solid var(--line)}
.ms-group{position:absolute;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:var(--msw)}
.ms-group.edge-first{transform:none}
.ms{display:block;width:100%;text-align:center;font-size:11.5px;line-height:1.25;padding:0 2px;transition:transform .12s}
.ms .lbl{color:var(--ink);font-weight:500;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.ms .lbl .who{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:600;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
.ms .lbl .who .dot{width:7px;height:7px;flex:none}
.ms .lbl .nm::after{content:" ›";opacity:.55}
.ms .lbl .rep{font-size:9.5px;font-weight:400;color:var(--muted);white-space:nowrap}
.ms:hover .lbl,.ms:focus-visible .lbl{border-color:var(--line-strong);box-shadow:0 3px 10px rgba(27,36,48,.14)}
.ms.optional .lbl{color:var(--muted);font-weight:400;border-style:dashed}
.ms .lbl .cyc{color:var(--muted);font-weight:400}
.body{position:relative}
.lines{position:absolute;left:190px;right:0;top:0;bottom:0;pointer-events:none}
.line{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line)}
.line.ms-line{border-left:1.5px dashed var(--line-strong)}
.line.phase-line{border-left:1px solid var(--line-strong)}
.tick{position:absolute;top:0;height:14px;width:0;border-left:1.5px dotted var(--line-strong)}
.ms-track .tick{top:auto;bottom:0;height:12px}
.lane{display:grid;grid-template-columns:190px repeat(8,1fr);grid-auto-rows:minmax(48px,auto);border-top:1px solid var(--line);position:relative}
.lane + .lane{border-top:1px solid var(--line-strong)}
.lane-label{grid-row:1 / span 2;grid-column:1;padding:12px 12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:sticky;left:0;background:var(--surface);z-index:2}
.lane-label b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.lane-label b::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--lc)}
.lane-label .flag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lane-label .sum{font-size:11.5px;color:var(--muted);line-height:1.35;visibility:hidden}
.lane:hover .lane-label .sum,.lane:focus-within .lane-label .sum{visibility:visible}
.blk{margin:6px 4px;padding:8px 24px 8px 10px;border-radius:6px;font-size:12.5px;line-height:1.3;text-align:left;position:relative;z-index:1;min-height:36px;display:flex;align-items:flex-start;gap:6px;border:1px solid transparent;transition:box-shadow .12s,transform .12s}
.blk::after{content:"›";position:absolute;right:8px;top:6px;font-size:16px;line-height:1;opacity:.55;font-weight:400}
.blk:hover::after,.blk:focus-visible::after{opacity:1}
.blk.primary{background:var(--lc);color:#fff;font-weight:500}
.blk.secondary{background:var(--lsoft);color:var(--ink)}
.blk.c1{background:repeating-linear-gradient(135deg,var(--lsoft) 0 3px,var(--surface) 3px 7px);border-color:var(--lc);color:var(--ink);font-weight:500}
.blk.c1.secondary{font-weight:400;opacity:.9}
.blk.cm1{background:var(--surface);border:1.5px dashed var(--lc);color:var(--ink)}
.blk:hover{box-shadow:0 0 0 2px var(--lc) inset,0 4px 12px rgba(27,36,48,.18);transform:translateY(-1px)}
.blk.secondary:hover,.blk.c1:hover,.blk.cm1:hover{box-shadow:0 0 0 1.5px var(--lc) inset,0 4px 12px rgba(27,36,48,.14)}
.blk .cyc{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.08);white-space:nowrap;flex:none;margin-top:1px}
.blk.primary.c0 .cyc{display:none}
.blk.c1 .cyc,.blk.cm1 .cyc{background:var(--lc);color:#fff}
.blk.faded{opacity:.18;pointer-events:none}

/* artifacts */
.arts{margin-top:26px}
.arts h2,.section h2{font-size:15px;font-weight:600;margin:0 0 6px}
.arts .intro{margin-bottom:10px}
.art-grid{display:grid;grid-template-columns:190px repeat(8,1fr);border-top:1px solid var(--line);position:relative}
.art-row{display:contents}
.art-row .art-label{grid-column:1;padding:12px 26px 12px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px;position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;position:sticky;transition:background .12s}
.art-row .art-label::after{content:"›";position:absolute;right:10px;top:10px;font-size:16px;opacity:.55}
.art-row .art-label:hover{background:var(--hover)}
.art-row .art-label:hover::after{opacity:1}
.art-row .art-label b{display:block;font-weight:600}
.art-row .art-label span{color:var(--muted);font-size:11.5px}
.art-track{grid-column:2 / -1;position:relative;height:72px;border-bottom:1px solid var(--line)}
.art-bar{position:absolute;top:26px;height:3px;background:var(--line-strong);border-radius:2px}
.art-bar.c1{background:repeating-linear-gradient(90deg,var(--line-strong) 0 6px,transparent 6px 10px)}
.art-bar.ongoing{background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 7px)}
.art-ongoing{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--muted)}
.cp{position:absolute;top:20px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:92px}
.cp i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);display:block}
.cp.has-r i{background:var(--ink)}
.cp small{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.cp b{font-size:10.5px;font-weight:600;color:var(--ink);position:absolute;top:-16px;white-space:nowrap}
.art-after{display:inline-block;margin-top:4px;font-size:10.5px;color:var(--muted);background:var(--chip);padding:2px 6px;border-radius:3px}

.notes{margin-top:22px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.notes h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.notes ul{margin:0;padding-left:18px;color:var(--ink)}
.notes li{margin:3px 0}

/* ---- other views ---- */
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pick button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:500}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .dot{flex:none}
.card .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.card p{margin:6px 0}
.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:12.5px;margin-top:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.kv ul{margin:0;padding-left:16px}
.pill{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.pill.c1{border:1px solid var(--line-strong)}
.wk-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wk-lane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-top:3px solid var(--lc)}
.wk-lane h3{font-size:13.5px;margin:0 0 8px;font-weight:600}
.wk-lane .blk{margin:6px 0}
.bounds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.bound{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.bound h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.bound .ms-item{display:flex;gap:8px;align-items:flex-start;padding:8px 26px 8px 6px;border-top:1px solid var(--line);text-align:left;width:100%;position:relative;border-radius:6px}
.bound .ms-item::after{content:"›";position:absolute;right:10px;top:8px;font-size:16px;opacity:.55}
.bound .ms-item:hover{background:var(--hover)}
.bound .ms-item:first-of-type{border-top:0}
.bound .ms-item b{font-weight:500}
.bound .ms-item small{color:var(--muted);display:block}
.empty{color:var(--muted);font-size:12.5px}
.fn-weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:16px}
.fn-week{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:120px}
.fn-week .wkh{font-size:11px;color:var(--muted);margin-bottom:6px}
.fn-week .blk{margin:4px 0;font-size:12px}
.fn-week .msdot{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.fn-week .msdot span{font-size:10.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.fn-ms{margin-top:8px}
.fn-summary{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lc);border-radius:10px;padding:12px 16px;margin-bottom:14px;max-width:70ch}
.fn-summary p{margin:0;color:var(--ink)}

/* drawer */
.drawer{position:fixed;top:env(safe-area-inset-top,0px);right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(100%);transition:transform .2s ease}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.blk,.ms,.art-label{transition:none}.blk:hover{transform:none}}
.drawer .close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:6px;font-size:18px;color:var(--muted)}
.drawer .close:hover{background:var(--hover)}
.drawer .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:6px}
.drawer h2{font-size:17px;margin:0 0 8px;font-weight:600;text-wrap:balance;padding-right:30px}
.drawer p{margin:8px 0;max-width:60ch}
.drawer .kv{grid-template-columns:86px 1fr}
.scrim{position:fixed;inset:0;z-index:19;display:none}
.scrim.open{display:block}

[hidden]{display:none!important}
.edited{color:var(--muted);font-size:12px}
.edit-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}
.edit-toggle input{margin:0}
body.editing .edit-toggle{border-color:var(--program);color:var(--program);font-weight:500}
.edit-note{font-size:12px;color:var(--muted);background:var(--program-soft);border-radius:6px;padding:8px 10px;margin:0 0 12px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.form input,.form textarea,.form select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;text-transform:none;letter-spacing:0;width:100%}
.form textarea{min-height:88px;resize:vertical;line-height:1.4}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form .actions{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.quiet{border-color:transparent;color:var(--muted)}
.form .err{color:#B42318;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:90vw}
.lane-label{cursor:default}
body.editing .lane-label{cursor:pointer}
body.editing .lane-label:hover{background:var(--hover)}
@media (max-width:640px){
  .bounds{grid-template-columns:1fr}
  .fn-weeks{grid-template-columns:repeat(2,1fr)}
}
</style>

<header class="top">
  <div class="top-row">
    <h1>Jam Cycle Map</h1>
    <span class="version mono" id="version"></span>
    <span class="edited mono" id="edited"></span>
    <label class="edit-toggle" id="edit-toggle" hidden><input type="checkbox" id="edit-mode"> Edit</label>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-view="cycle" aria-selected="true">The cycle</button>
    <button class="tab" role="tab" data-view="week" aria-selected="false">This week</button>
    <button class="tab" role="tab" data-view="function" aria-selected="false">By function</button>
  </nav>
</header>

<main>
  <section class="view" id="view-cycle">
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="show-c0" checked> <span class="swatch" style="background:var(--product)"></span> This cycle</label>
      <label class="toggle"><input type="checkbox" id="show-c1" checked> <span class="swatch c1"></span> Next-cycle prep (+1)</label>
      <label class="toggle"><input type="checkbox" id="show-cm1" checked> <span class="swatch cm1"></span> Prior-cycle close-out (−1)</label>
    </div>
    <div class="controls groups" id="group-controls"></div>
    <div class="map-wrap"><div class="map" id="map"></div></div>

    <div class="arts">
      <h2>Documents across the cycle</h2>
      <div class="map-wrap"><div class="map" id="artmap"></div></div>
    </div>

    <div class="notes" id="notes"></div>
  </section>

  <section class="view" id="view-week" hidden>
    <div class="pick" id="week-pick"></div>
    <div id="week-body"></div>
  </section>

  <section class="view" id="view-function" hidden>
    <div class="pick" id="fn-pick"></div>
    <div class="map-wrap"><div class="map" id="fn-map"></div></div>
  </section>


</main>

<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" hidden></div>
<aside class="drawer" id="drawer" aria-live="polite">
  <button class="close" id="drawer-close" aria-label="Close">×</button>
  <div id="drawer-body"></div>
</aside>

t is not in the pod; it joins when one of its items is picked. This is a surface to test whether anything would stop this becoming the official plan."}, {"lane": "product", "weeks": [7, 8], "layer": "secondary", "cycle": 0, "title": "Enablement sessions; docs to about 80%", "detail": "Present alongside Program at the two enablement sessions. Confirm what is in production versus still building."}, {"lane": "engineering", "weeks": [1, 2], "layer": "primary", "cycle": 0, "title": "Cooldown and ramp-up", "detail": "Self-led. Cooldown is whatever gets the team refreshed: tech debt, a retro, a half day off. Ramp-up is planning with the PM, breaking down the opportunity, and writing the Pod Delivery Plan. The one thing that must be true at the end: a Pod Delivery Plan Product is aligned with."}, {"lane": "engineering", "weeks": [3, 8], "layer": "primary", "cycle": 0, "title": "Focused delivery", "detail": "Protected build time. Make progress visible early, test assumptions while change is still possible, push meaningful changes into the ledger before they become surprises. Ends with a shipped increment and Engineering Demo Day."}, {"lane": "engineering", "weeks": [7, 8], "layer": "secondary", "cycle": 1, "title": "Opportunity intake (engineering lead)", "detail": "The pod's engineering lead joins the product and design leads for a first pass at the forecast opportunities. Secondary to delivery."}, {"lane": "design", "weeks": [1, 2], "layer": "primary", "cycle": 0, "title": "Design V1", "detail": "First version of the designs for the selected opportunity, in parallel with pod refinement."}, {"lane": "design", "weeks": [1, 2], "layer": "secondary", "cycle": 0, "title": "Refine with the pod and PM", "detail": "Design takes part in pod refinement sessions and the Pitch-back so the Pod Delivery Plan and the design direction agree."}, {"lane": "design", "weeks": [3, 4], "layer": "primary", "cycle": 0, "title": "Iterate, align, test", "detail": "Iterate on V1, align with the pod and design leadership, test with users. Design Share-outs at the end of week 3, Design Demo Day at the end of week 4."}, {"lane": "design", "weeks": [5, 6], "layer": "primary", "cycle": 0, "title": "Iterate, harden, hand off", "detail": "Take the direction the pod landed on and make it ready: edge cases, states, handoff to engineering."}, {"lane": "design", "weeks": [7, 8], "layer": "primary", "cycle": 1, "title": "Opportunity intake (design lead)", "detail": "The pod's design lead joins the first pass at the forecast opportunities for next cycle."}, {"lane": "design", "weeks": [7, 8], "layer": "secondary", "cycle": 0, "title": "Support delivery; release QA in week 8", "detail": "Answer build questions and, in the final week, QA what is about to release: what needs cleaning up before we are ready to go."}, {"lane": "pmm", "weeks": [1, 2], "layer": "primary", "cycle": 0, "title": "Discuss proposed launch tiers", "detail": "Tiers were proposed right after Portfolio Review. Weeks 1 and 2 are for conversation about what a Tier 1, 2 or 3 means for storytelling and strategy, a full eight weeks before release."}, {"lane": "pmm", "weeks": [1, 2], "layer": "secondary", "cycle": -1, "title": "Release notes and launch comms for shipped work", "detail": "Work that landed on time rides this release: release notes and initial launch communications. Work that did not rolls to the next cycle's launch."}, {"lane": "pmm", "weeks": [3, 4], "layer": "primary", "cycle": 0, "title": "Confirm launch tier; open the Launch Brief", "detail": "By the end of week 3 the shape of the solution is known well enough to confirm the tier and draft the launch language."}, {"lane": "pmm", "weeks": [5, 6], "layer": "primary", "cycle": 0, "title": "Product messaging framework (Tier 1 and 2)", "detail": "Positioning, narrative, proof and what not to overstate, captured in the Launch Brief."}, {"lane": "pmm", "weeks": [7, 8], "layer": "primary", "cycle": 0, "title": "Launch timing, GTM plan, packaging and pricing", "detail": "Finalize the plan for bringing the work to market alongside the enablement sessions."}, {"lane": "pmm", "weeks": [7, 8], "layer": "secondary", "cycle": 1, "title": "Propose launch tiers for next cycle", "detail": "Right after Portfolio Review, propose a tier for each confirmed opportunity so the conversation can start early."}, {"lane": "program", "weeks": [1, 2], "layer": "primary", "cycle": 0, "title": "Inspect what we expect: every pod has PM sessions, Big Room Planning and a Pitch-back", "detail": "Teams plan however they want, but each pod either has these in place or can say why they are unnecessary. Ends by opening the Launch Brief and Walkthrough/FAQ drafts at Delivery Kickoff."}, {"lane": "program", "weeks": [1, 2], "layer": "secondary", "cycle": -1, "title": "Close out prior-cycle enablement docs to 100%", "detail": "Coordinate the last 20% with Product, PMM and CS/Sales owners now that the work has shipped."}, {"lane": "program", "weeks": [3, 4], "layer": "primary", "cycle": 0, "title": "Progress the drafts; add the Design Demo Day recording", "detail": "Each org-wide moment gets recorded and added to the Launch Brief and Walkthrough/FAQ so they build up over the cycle."}, {"lane": "program", "weeks": [5, 6], "layer": "primary", "cycle": 0, "title": "Prepare enablement; optional early session", "detail": "Sessions can happen any time after Design Demo Day. Some cycles have one at the start of week 6 or even week 4."}, {"lane": "program", "weeks": [7, 8], "layer": "primary", "cycle": 0, "title": "Run enablement sessions; docs to about 80%", "detail": "Two sessions, at the start of week 7 and week 8, bring the full CS and Sales teams through what is coming. Each project is covered in one of them; two dates give enough time for everything and space between. Recorded and added to the docs. We call a project about 80% enabled after its session, since the final version is not yet in production."}, {"lane": "program", "weeks": [3, 8], "layer": "secondary", "cycle": 0, "title": "System health: ledger, change notices, checkpoints", "detail": "Keep cadence, escalation paths and cross-functional clarity working. Hidden change is the failure mode, not change."}], "milestones": [{"id": "refine-1", "at": 0.5, "name": "Refinement 1", "kind": "product", "cycle": 0, "repeats": "per opportunity", "audience": "The PM and the pod that picked up the opportunity", "inputs": ["The selected opportunity pitch"], "detail": "First working session between the PM and the pod, in the middle of week 1. One per opportunity, so several run in parallel across the pods.", "outcomes": ["Shared read on the problem space", "First cut at an implementation approach"]}, {"id": "eng-leader-planning", "at": 1, "name": "Engineering Leader Planning", "kind": "engineering", "cycle": 0, "audience": "All engineering leaders", "inputs": ["Each pod's early thinking after first sessions with the PM"], "detail": "A sounding board at the end of week 1, across all the pods. Requires that initial conversations with Product have already happened.", "outcomes": ["Risks, dependencies and opportunities surfaced", "Plans pressure-tested with peers"]}, {"id": "refine-2", "at": 1.5, "name": "Refinement 2", "kind": "product", "cycle": 0, "repeats": "per opportunity", "audience": "The PM and the pod that picked up the opportunity", "inputs": ["The thinking from Refinement 1 and Engineering Leader Planning"], "detail": "Second working session between the PM and the pod, in the middle of week 2, ahead of the pitch-back.", "outcomes": ["Implementation approach settled enough to pitch back", "Scope and cut lines understood"]}, {"id": "pitchback", "at": 2, "name": "Engineering Pitch-back", "kind": "engineering", "cycle": 0, "repeats": "per pod", "audience": "The pod, Engineering, Product and Design", "inputs": ["Draft Pod Delivery Plan"], "detail": "The pod presents its implementation plan back to Product. The checkpoint that says planning is done. Every pod has one unless there is a reason it does not make sense.", "outcomes": ["Pod Delivery Plan aligned with Product", "Ready for delivery"]}, {"id": "delivery-kickoff", "at": 2, "name": "Delivery Kickoff", "kind": "build", "cycle": 0, "audience": "Full Build Org plus key stakeholders; anyone welcome", "inputs": ["Pod Delivery Plans aligned at Pitch-back"], "detail": "Celebrates the end of planning and tells everyone what we are going for. First point where the downstream documents exist.", "outcomes": ["Aligned Build Org and stakeholders", "Launch Brief and Walkthrough/FAQ drafts opened", "Product Delivery Ledger becomes the live view of committed work"]}, {"id": "design-shareout-team", "at": 2.5, "name": "Design Share-out (design team)", "kind": "design", "cycle": 0, "audience": "The design team", "inputs": ["Iterated designs"], "detail": "Designers share the work with each other first, inside the design team.", "outcomes": ["Design direction reviewed by peers"]}, {"id": "design-shareout-pod", "at": 3, "name": "Design Share-out (pod & stakeholders)", "kind": "design", "cycle": 0, "repeats": "per opportunity", "audience": "The designer, the pod working the project, and any stakeholders who need to be there", "inputs": ["Iterated designs, reviewed inside the design team"], "detail": "The second share-out, with the pod delivering the project and the stakeholders attached to it. One per project, so several run across the pods.", "outcomes": ["Confirmation the design is on track with the pod and its stakeholders"]}, {"id": "tiers", "at": 3, "name": "Confirm Launch Tiers", "kind": "gate", "cycle": 0, "audience": "PMM, Product, Program", "inputs": ["Proposed tiers", "Shape of the solution from planning"], "detail": "We do not know exactly what is coming, but we know the shape of it and how big a deal to make of it.", "outcomes": ["Tier confirmed per project (target 100%)", "Launch language drafted"]}, {"id": "design-demo", "at": 4, "name": "Design Demo Day", "kind": "org", "cycle": 0, "audience": "Full organization", "inputs": ["V1 concepts, research and findings"], "detail": "Midpoint of the cycle. First time the wider business sees the product taking shape.", "outcomes": ["Recording, added to the Launch Brief and Walkthrough/FAQ", "Business sees the direction taking shape"]}, {"id": "opp-proposals", "at": 4, "name": "Opportunity Proposals", "kind": "product", "cycle": 1, "repeats": "weekly, weeks 3-4", "audience": "The product team", "inputs": ["Customer, stakeholder and data signals"], "detail": "The product team works through candidate opportunities together across weeks 3 and 4.", "outcomes": ["A set of candidate opportunities worth taking further"]}, {"id": "pitch-discovery", "at": 4.5, "name": "Pitch Discovery", "kind": "product", "cycle": 1, "repeats": "per opportunity", "audience": "Product and the internal stakeholders relevant to the opportunity", "inputs": ["Draft opportunity pitch"], "detail": "Brings internal stakeholders in early so a pitch is informed by the people who hold relevant context. One per opportunity.", "outcomes": ["A stronger pitch candidate, informed by internal stakeholders"]}, {"id": "enable-early", "at": 5, "name": "Enablement Session (optional, early)", "kind": "gtm", "cycle": 0, "status": "optional", "audience": "CS and Sales", "inputs": ["Current docs and demos"], "detail": "Some cycles run an extra session at the start of week 6 or week 4. Any time after Design Demo Day works.", "outcomes": ["Earlier readiness where the work allows it"]}, {"id": "portfolio-dry-run", "at": 5, "name": "Portfolio Review Dry Run", "kind": "product", "cycle": 1, "audience": "The product team", "inputs": ["Draft pitches and a working rank order"], "detail": "The product team gets together the week before Portfolio Review and hashes out the plan it will bring.", "outcomes": ["Pitches finalized", "Rank order agreed before the review"]}, {"id": "delivery-check-1", "at": 5, "name": "Delivery Check", "kind": "engineering", "cycle": 0, "repeats": "per pod", "audience": "The pod, the PM or PMs, and program management", "inputs": ["Where delivery actually stands"], "detail": "A week before Enablement Session 1. A read on how the pod's projects are shaking out, which enablement session each one slots into, and the current thinking on release, scope and launch. Big questions stay open; the point is to understand them as early as we can.", "outcomes": ["Read on delivery confidence", "Enablement session slotting", "Open questions named early"]}, {"id": "portfolio", "at": 6, "name": "Portfolio Review", "kind": "leadership", "cycle": 1, "audience": "Executive team, extended leadership and key stakeholders; all PMs present and presenting", "inputs": ["Finalized, ranked opportunity pitches"], "detail": "The business says yes or no, with conversation where needed. Everything downstream for next cycle keys off this.", "outcomes": ["Confirmed, ranked list of work for next cycle"]}, {"id": "select", "at": 6, "name": "Pods Select Pitches (forecast)", "kind": "gate", "cycle": 1, "audience": "Pod leads and Product", "inputs": ["Confirmed ranked list"], "detail": "A forecast, not a commitment. The whole team is not present and we are still building.", "outcomes": ["Forecast of what each pod will take on", "Start of opportunity intake"]}, {"id": "enable-1", "at": 6, "name": "Enablement Session 1", "kind": "gtm", "cycle": 0, "audience": "Full CS and Sales teams", "inputs": ["Launch Brief and Walkthrough/FAQ drafts for the projects covered", "Demos of work in progress"], "detail": "Start of week 7. Two independent sessions a week apart; each project is covered in one of them. Two dates give enough time for everything and space between. About 80%, not 100%, because the final version is not yet in production and the docs are still partial.", "outcomes": ["Recording added to the docs", "CS and Sales about 80% enabled on the projects covered"]}, {"id": "delivery-check-2", "at": 6, "name": "Delivery Check", "kind": "engineering", "cycle": 0, "repeats": "per pod", "audience": "The pod, the PM or PMs, and program management", "inputs": ["Where delivery actually stands"], "detail": "A week before Enablement Session 2. A read on how the pod's projects are shaking out, which enablement session each one slots into, and the current thinking on release, scope and launch.", "outcomes": ["Read on delivery confidence", "Enablement session slotting", "Open questions named early"]}, {"id": "enable-2", "at": 7, "name": "Enablement Session 2", "kind": "gtm", "cycle": 0, "audience": "Full CS and Sales teams", "inputs": ["Launch Brief and Walkthrough/FAQ drafts for the projects covered", "Demos of work in progress"], "detail": "Start of week 8. Two independent sessions a week apart; each project is covered in one of them. Two dates give enough time for everything and space between. About 80%, not 100%, because the final version is not yet in production and the docs are still partial.", "outcomes": ["Recording added to the docs", "CS and Sales about 80% enabled on the projects covered"]}, {"id": "opp-intake", "at": 7, "name": "Opportunity Intake", "kind": "product", "cycle": 1, "repeats": "per opportunity", "audience": "The product, engineering and design leaders for the pod", "inputs": ["The opportunities the pod forecast it will pick up"], "detail": "Product, engineering and design leaders take a first pass at the items the pods expect to pick up for the next cycle: high-level understanding and sense-checking of the opportunity, in the last two weeks.", "outcomes": ["High-level shared understanding of each forecast opportunity", "Anything that would stop this becoming the official plan surfaced"]}, {"id": "eng-demo", "at": 8, "name": "Engineering Demo Day", "kind": "org", "cycle": 0, "audience": "Full organization", "inputs": ["What the pods delivered"], "detail": "Celebratory show and tell. Completes the org-wide arc: Design Demo Day showed the shape, Engineering Demo Day shows what is real.", "outcomes": ["Recording", "Cycle closes; the next cycle begins"]}], "artifacts": [{"id": "strategic-brief", "name": "Strategic Brief", "owner": "Product", "cycle": 0, "cadence": "Ongoing; updated as needed", "purpose": "The layer above an opportunity: a long-running mission document carrying the broader strategy for an area. Investment areas live here — change management, workflows, contract review, payment compliance — and opportunities are pulled out of them. We do not always have one, but where it exists the higher-level thinking stays put, so writing an opportunity becomes a matter of choosing which investment to make now rather than rebuilding the case from scratch.", "checkpoints": []}, {"id": "opportunity", "name": "Opportunity", "owner": "Product", "cycle": 1, "purpose": "Product's way of pitching work: a constrained problem space leadership can evaluate and pods can shape.", "checkpoints": [{"at": 2, "label": "Shaping begins"}, {"at": 5, "label": "Pitches finalized"}, {"at": 6, "label": "Confirmed at Portfolio Review"}]}, {"id": "plan", "name": "Pod Delivery Plan", "owner": "Pod, led by Engineering", "cycle": 0, "purpose": "The pod's way of confirming its plan: chosen approach, intended increment, scope, cut lines, risks.", "checkpoints": [{"at": 1, "label": "First pass at Big Room Planning"}, {"at": 2, "label": "Aligned with Product at Pitch-back"}]}, {"id": "launch-brief", "name": "Launch Brief", "owner": "Product Marketing, with Product", "cycle": 0, "purpose": "How to talk about the work: audience, positioning, what not to overstate, launch posture.", "checkpoints": [{"at": 2, "label": "Draft opened", "readiness": "Draft"}, {"at": 3, "label": "Tier confirmed", "readiness": "Tier 100%"}, {"at": 4, "label": "Design Demo added"}, {"at": 6, "label": "Enablement session", "readiness": "~80%"}, {"at": 7, "label": "Enablement session", "readiness": "~80%"}], "after": "100% by end of week 2 of next cycle"}, {"id": "faq", "name": "Feature Walkthrough & FAQ", "owner": "CS / Sales / Support owner, with Product", "cycle": 0, "purpose": "How the delivered experience actually works, its limits, and how to demo, support and answer questions.", "checkpoints": [{"at": 2, "label": "Draft opened", "readiness": "Draft"}, {"at": 4, "label": "Design Demo added"}, {"at": 6, "label": "Enablement session", "readiness": "~80%"}, {"at": 7, "label": "Enablement session", "readiness": "~80%"}], "after": "100% by end of week 2 of next cycle"}], "notes": ["Pitch Reactor has been removed.", "The monthly CS Listening Session runs the second Friday of each month, which does not map to cycle weeks, so it is not shown.", "Only whole-company, Build Org, leadership and CS & Sales moments are drawn. Team and pod sessions remain in the data, hidden.", "Opportunity + Pitch Collab in the old diagram is now simply Opportunity intake (weeks 7 and 8).", "Readiness percentages (80% at enablement, tier 100% by week 3) are provisional targets.", "Product Marketing's lane and the post-cycle PMM work (release notes, launch comms) are placeholders pending definition.", "Closing the prior cycle's docs to 100% in weeks 1 and 2 is new and not in the Notion pages yet.", "Engineering Big Room Planning at the end of week 1 was missing from the Figma; it is in the data as a hidden team session.", "Draft 4: Product Delivery Ledger removed from the documents view; it is a live view of the opportunity list, not a document with its own progression.", "Draft 5: Jam Session Kickoff removed (not currently held). Milestone owners removed; outputs renamed outcomes. Enablement sessions described as independent, each covering a set of projects. Milestones and Documents tabs removed.", "Draft 9: Product, Design and Engineering meetings added as toggleable audience groups. Every chip states its own audience, so stacked chips read correctly. Milestones can sit mid-week.", "Draft 9: the design share-out timings (mid-week 3, end-week 3) and Opportunity Proposals (end-week 4, weekly across weeks 3-4) are inferred. The sequence is documented; the dates are not.", "Draft 10: Strategic Brief added above Opportunity. It is a long-running document with no points in the cycle, so it draws as an ongoing band rather than a progression."]}</script>
<script id="tpl" type="application/json">"<meta charset=\"utf-8\">\n<title>Jam Cycle Map<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<style>\n:root{\n  --bg:#F6F7FA; --surface:#FFFFFF; --ink:#1B2430; --muted:#5C6878; --line:#DCE1E9; --line-strong:#B9C2CF;\n  --hover:#EEF1F6; --chip:#E9EDF3;\n  --product:#2F6FDB; --engineering:#2E9E5B; --design:#D9961F; --pmm:#CF3F97; --program:#6B5BD2;\n  --product-soft:#E3ECFB; --engineering-soft:#E1F3E8; --design-soft:#FBEFD6; --pmm-soft:#F9E1F0; --program-soft:#E9E6F9;\n  --org:#1B2430; --build:#0E7C86; --shadow:0 12px 32px rgba(27,36,48,.12);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#12161C; --surface:#1A1F27; --ink:#E8ECF2; --muted:#98A3B3; --line:#2B323D; --line-strong:#465064;\n    --hover:#222936; --chip:#262D38;\n    --product:#6D9BF0; --engineering:#5CC487; --design:#E7B24C; --pmm:#E56FB8; --program:#9B8DF0;\n    --product-soft:#1F2C44; --engineering-soft:#1B3328; --design-soft:#3A2F17; --pmm-soft:#3B1F31; --program-soft:#28244A;\n    --org:#E8ECF2; --build:#3FB8C4; --shadow:0 12px 32px rgba(0,0,0,.5);\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#12161C; --surface:#1A1F27; --ink:#E8ECF2; --muted:#98A3B3; --line:#2B323D; --line-strong:#465064;\n  --hover:#222936; --chip:#262D38;\n  --product:#6D9BF0; --engineering:#5CC487; --design:#E7B24C; --pmm:#E56FB8; --program:#9B8DF0;\n  --product-soft:#1F2C44; --engineering-soft:#1B3328; --design-soft:#3A2F17; --pmm-soft:#3B1F31; --program-soft:#28244A;\n  --org:#E8ECF2; --build:#3FB8C4; --shadow:0 12px 32px rgba(0,0,0,.5);\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:\"IBM Plex Sans\",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;margin:0}\n.mono{font-family:\"IBM Plex Mono\",ui-monospace,SFMono-Regular,Menlo,monospace}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\nbutton:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--product);outline-offset:2px}\n\n.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}\n.top-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:1400px;margin:0 auto}\nh1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}\n.version{color:var(--muted);font-size:12px}\n.tabs{display:flex;gap:2px;margin-top:8px;max-width:1400px;margin-inline:auto;overflow-x:auto}\n.tab{padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}\n.tab[aria-selected=\"true\"]{color:var(--ink);border-color:var(--ink)}\n.tab:hover{color:var(--ink)}\n\nmain{max-width:1400px;margin:0 auto;padding:18px 16px 60px}\n.view[hidden]{display:none}\n.intro{color:var(--muted);max-width:68ch;margin:0 0 14px}\n.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}\n.controls.groups{gap:8px;margin-bottom:16px}\n.controls.groups .toggle .dot{flex:none}\n.ctl-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}\n.toggle{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px}\n.toggle input{margin:0}\n.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}\n.swatch.c1{background:repeating-linear-gradient(135deg,var(--line-strong) 0 2px,transparent 2px 5px)}\n.swatch.cm1{border:1.5px dashed var(--line-strong)}\n.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;align-items:center}\n.legend .k{display:inline-flex;align-items:center;gap:6px}\n.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted)}\n.dot.org{background:var(--org)}\n.dot.build{background:var(--build);border-radius:3px}\n.dot.leadership{background:var(--org);border-radius:2px}\n.dot.gtm{background:var(--program)}\n.dot.product{background:var(--product)}\n.dot.design{background:var(--design)}\n.dot.engineering{background:var(--engineering)}\n.dot.team{background:var(--surface);border:2px solid var(--muted)}\n.dot.gate{background:var(--design);border-radius:2px;transform:rotate(45deg)}\n\n/* ---- cycle map ---- */\n.map-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}\n.map{min-width:920px;padding:0 calc((100% - 190px) / 17) 12px 0}\n.grid{display:grid;grid-template-columns:190px repeat(8,1fr);position:relative}\n.phase-row .phase{grid-row:1;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);padding:12px 10px 4px;border-bottom:1px solid var(--line)}\n.phase-row .phase.p2{border-left:1px solid var(--line-strong)}\n.week-row .wk{padding:6px 10px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}\n.week-row .wk.w3{border-left:1px solid var(--line-strong)}\n.week-row .corner{border-bottom:1px solid var(--line)}\n.ms-row{position:relative;height:72px;grid-column:1 / -1}\n.ms-track{position:absolute;left:190px;right:0;top:0;bottom:0}\n.ms-track::after{content:\"\";position:absolute;left:0;right:0;bottom:0;border-bottom:1px solid var(--line)}\n.ms-group{position:absolute;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:var(--msw)}\n.ms-group.edge-first{transform:none}\n.ms{display:block;width:100%;text-align:center;font-size:11.5px;line-height:1.25;padding:0 2px;transition:transform .12s}\n.ms .lbl{color:var(--ink);font-weight:500;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;display:inline-flex;flex-direction:column;align-items:center;gap:2px}\n.ms .lbl .who{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:600;letter-spacing:.07em;color:var(--muted);white-space:nowrap}\n.ms .lbl .who .dot{width:7px;height:7px;flex:none}\n.ms .lbl .nm::after{content:\" ›\";opacity:.55}\n.ms .lbl .rep{font-size:9.5px;font-weight:400;color:var(--muted);white-space:nowrap}\n.ms:hover .lbl,.ms:focus-visible .lbl{border-color:var(--line-strong);box-shadow:0 3px 10px rgba(27,36,48,.14)}\n.ms.optional .lbl{color:var(--muted);font-weight:400;border-style:dashed}\n.ms .lbl .cyc{color:var(--muted);font-weight:400}\n.body{position:relative}\n.lines{position:absolute;left:190px;right:0;top:0;bottom:0;pointer-events:none}\n.line{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line)}\n.line.ms-line{border-left:1.5px dashed var(--line-strong)}\n.line.phase-line{border-left:1px solid var(--line-strong)}\n.tick{position:absolute;top:0;height:14px;width:0;border-left:1.5px dotted var(--line-strong)}\n.ms-track .tick{top:auto;bottom:0;height:12px}\n.lane{display:grid;grid-template-columns:190px repeat(8,1fr);grid-auto-rows:minmax(48px,auto);border-top:1px solid var(--line);position:relative}\n.lane + .lane{border-top:1px solid var(--line-strong)}\n.lane-label{grid-row:1 / span 2;grid-column:1;padding:12px 12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:sticky;left:0;background:var(--surface);z-index:2}\n.lane-label b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}\n.lane-label b::before{content:\"\";width:4px;height:16px;border-radius:2px;background:var(--lc)}\n.lane-label .flag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}\n.lane-label .sum{font-size:11.5px;color:var(--muted);line-height:1.35;visibility:hidden}\n.lane:hover .lane-label .sum,.lane:focus-within .lane-label .sum{visibility:visible}\n.blk{margin:6px 4px;padding:8px 24px 8px 10px;border-radius:6px;font-size:12.5px;line-height:1.3;text-align:left;position:relative;z-index:1;min-height:36px;display:flex;align-items:flex-start;gap:6px;border:1px solid transparent;transition:box-shadow .12s,transform .12s}\n.blk::after{content:\"›\";position:absolute;right:8px;top:6px;font-size:16px;line-height:1;opacity:.55;font-weight:400}\n.blk:hover::after,.blk:focus-visible::after{opacity:1}\n.blk.primary{background:var(--lc);color:#fff;font-weight:500}\n.blk.secondary{background:var(--lsoft);color:var(--ink)}\n.blk.c1{background:repeating-linear-gradient(135deg,var(--lsoft) 0 3px,var(--surface) 3px 7px);border-color:var(--lc);color:var(--ink);font-weight:500}\n.blk.c1.secondary{font-weight:400;opacity:.9}\n.blk.cm1{background:var(--surface);border:1.5px dashed var(--lc);color:var(--ink)}\n.blk:hover{box-shadow:0 0 0 2px var(--lc) inset,0 4px 12px rgba(27,36,48,.18);transform:translateY(-1px)}\n.blk.secondary:hover,.blk.c1:hover,.blk.cm1:hover{box-shadow:0 0 0 1.5px var(--lc) inset,0 4px 12px rgba(27,36,48,.14)}\n.blk .cyc{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.08);white-space:nowrap;flex:none;margin-top:1px}\n.blk.primary.c0 .cyc{display:none}\n.blk.c1 .cyc,.blk.cm1 .cyc{background:var(--lc);color:#fff}\n.blk.faded{opacity:.18;pointer-events:none}\n\n/* artifacts */\n.arts{margin-top:26px}\n.arts h2,.section h2{font-size:15px;font-weight:600;margin:0 0 6px}\n.arts .intro{margin-bottom:10px}\n.art-grid{display:grid;grid-template-columns:190px repeat(8,1fr);border-top:1px solid var(--line);position:relative}\n.art-row{display:contents}\n.art-row .art-label{grid-column:1;padding:12px 26px 12px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px;position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;position:sticky;transition:background .12s}\n.art-row .art-label::after{content:\"›\";position:absolute;right:10px;top:10px;font-size:16px;opacity:.55}\n.art-row .art-label:hover{background:var(--hover)}\n.art-row .art-label:hover::after{opacity:1}\n.art-row .art-label b{display:block;font-weight:600}\n.art-row .art-label span{color:var(--muted);font-size:11.5px}\n.art-track{grid-column:2 / -1;position:relative;height:72px;border-bottom:1px solid var(--line)}\n.art-bar{position:absolute;top:26px;height:3px;background:var(--line-strong);border-radius:2px}\n.art-bar.c1{background:repeating-linear-gradient(90deg,var(--line-strong) 0 6px,transparent 6px 10px)}\n.art-bar.ongoing{background:repeating-linear-gradient(90deg,var(--line-strong) 0 2px,transparent 2px 7px)}\n.art-ongoing{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--muted)}\n.cp{position:absolute;top:20px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:92px}\n.cp i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);display:block}\n.cp.has-r i{background:var(--ink)}\n.cp small{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}\n.cp b{font-size:10.5px;font-weight:600;color:var(--ink);position:absolute;top:-16px;white-space:nowrap}\n.art-after{display:inline-block;margin-top:4px;font-size:10.5px;color:var(--muted);background:var(--chip);padding:2px 6px;border-radius:3px}\n\n.notes{margin-top:22px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}\n.notes h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}\n.notes ul{margin:0;padding-left:18px;color:var(--ink)}\n.notes li{margin:3px 0}\n\n/* ---- other views ---- */\n.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}\n.pick button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:500}\n.pick button[aria-pressed=\"true\"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}\n.card h3{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.card h3 .dot{flex:none}\n.card .meta{color:var(--muted);font-size:12px;margin-bottom:8px}\n.card p{margin:6px 0}\n.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:12.5px;margin-top:8px}\n.kv dt{color:var(--muted)} .kv dd{margin:0}\n.kv ul{margin:0;padding-left:16px}\n.pill{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}\n.pill.c1{border:1px solid var(--line-strong)}\n.wk-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}\n.wk-lane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-top:3px solid var(--lc)}\n.wk-lane h3{font-size:13.5px;margin:0 0 8px;font-weight:600}\n.wk-lane .blk{margin:6px 0}\n.bounds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}\n.bound{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}\n.bound h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}\n.bound .ms-item{display:flex;gap:8px;align-items:flex-start;padding:8px 26px 8px 6px;border-top:1px solid var(--line);text-align:left;width:100%;position:relative;border-radius:6px}\n.bound .ms-item::after{content:\"›\";position:absolute;right:10px;top:8px;font-size:16px;opacity:.55}\n.bound .ms-item:hover{background:var(--hover)}\n.bound .ms-item:first-of-type{border-top:0}\n.bound .ms-item b{font-weight:500}\n.bound .ms-item small{color:var(--muted);display:block}\n.empty{color:var(--muted);font-size:12.5px}\n.fn-weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:16px}\n.fn-week{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:120px}\n.fn-week .wkh{font-size:11px;color:var(--muted);margin-bottom:6px}\n.fn-week .blk{margin:4px 0;font-size:12px}\n.fn-week .msdot{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}\n.fn-week .msdot span{font-size:10.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}\n.fn-ms{margin-top:8px}\n.fn-summary{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lc);border-radius:10px;padding:12px 16px;margin-bottom:14px;max-width:70ch}\n.fn-summary p{margin:0;color:var(--ink)}\n\n/* drawer */\n.drawer{position:fixed;top:env(safe-area-inset-top,0px);right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(100%);transition:transform .2s ease}\n.drawer.open{transform:none}\n@media (prefers-reduced-motion:reduce){.drawer,.blk,.ms,.art-label{transition:none}.blk:hover{transform:none}}\n.drawer .close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:6px;font-size:18px;color:var(--muted)}\n.drawer .close:hover{background:var(--hover)}\n.drawer .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:6px}\n.drawer h2{font-size:17px;margin:0 0 8px;font-weight:600;text-wrap:balance;padding-right:30px}\n.drawer p{margin:8px 0;max-width:60ch}\n.drawer .kv{grid-template-columns:86px 1fr}\n.scrim{position:fixed;inset:0;z-index:19;display:none}\n.scrim.open{display:block}\n\n[hidden]{display:none!important}\n.edited{color:var(--muted);font-size:12px}\n.edit-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}\n.edit-toggle input{margin:0}\nbody.editing .edit-toggle{border-color:var(--program);color:var(--program);font-weight:500}\n.edit-note{font-size:12px;color:var(--muted);background:var(--program-soft);border-radius:6px;padding:8px 10px;margin:0 0 12px}\n.form{display:grid;gap:10px}\n.form label{display:grid;gap:4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}\n.form input,.form textarea,.form select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;text-transform:none;letter-spacing:0;width:100%}\n.form textarea{min-height:88px;resize:vertical;line-height:1.4}\n.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}\n.form .actions{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}\n.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500}\n.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n.btn:disabled{opacity:.5;cursor:default}\n.btn.quiet{border-color:transparent;color:var(--muted)}\n.form .err{color:#B42318;font-size:12.5px}\n.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;box-shadow:var(--shadow);max-width:90vw}\n.lane-label{cursor:default}\nbody.editing .lane-label{cursor:pointer}\nbody.editing .lane-label:hover{background:var(--hover)}\n@media (max-width:640px){\n  .bounds{grid-template-columns:1fr}\n  .fn-weeks{grid-template-columns:repeat(2,1fr)}\n}\n<\/style>\n\n<header class=\"top\">\n  <div class=\"top-row\">\n    <h1>Jam Cycle Map<\/h1>\n    <span class=\"version mono\" id=\"version\"><\/span>\n    <span class=\"edited mono\" id=\"edited\"><\/span>\n    <label class=\"edit-toggle\" id=\"edit-toggle\" hidden><input type=\"checkbox\" id=\"edit-mode\"> Edit<\/label>\n  <\/div>\n  <nav class=\"tabs\" role=\"tablist\" id=\"tabs\">\n    <button class=\"tab\" role=\"tab\" data-view=\"cycle\" aria-selected=\"true\">The cycle<\/button>\n    <button class=\"tab\" role=\"tab\" data-view=\"week\" aria-selected=\"false\">This week<\/button>\n    <button class=\"tab\" role=\"tab\" data-view=\"function\" aria-selected=\"false\">By function<\/button>\n  <\/nav>\n<\/header>\n\n<main>\n  <section class=\"view\" id=\"view-cycle\">\n    <div class=\"controls\">\n      <label class=\"toggle\"><input type=\"checkbox\" id=\"show-c0\" checked> <span class=\"swatch\" style=\"background:var(--product)\"><\/span> This cycle<\/label>\n      <label class=\"toggle\"><input type=\"checkbox\" id=\"show-c1\" checked> <span class=\"swatch c1\"><\/span> Next-cycle prep (+1)<\/label>\n      <label class=\"toggle\"><input type=\"checkbox\" id=\"show-cm1\" checked> <span class=\"swatch cm1\"><\/span> Prior-cycle close-out (−1)<\/label>\n    <\/div>\n    <div class=\"controls groups\" id=\"group-controls\"><\/div>\n    <div class=\"map-wrap\"><div class=\"map\" id=\"map\"><\/div><\/div>\n\n    <div class=\"arts\">\n      <h2>Documents across the cycle<\/h2>\n      <div class=\"map-wrap\"><div class=\"map\" id=\"artmap\"><\/div><\/div>\n    <\/div>\n\n    <div class=\"notes\" id=\"notes\"><\/div>\n  <\/section>\n\n  <section class=\"view\" id=\"view-week\" hidden>\n    <div class=\"pick\" id=\"week-pick\"><\/div>\n    <div id=\"week-body\"><\/div>\n  <\/section>\n\n  <section class=\"view\" id=\"view-function\" hidden>\n    <div class=\"pick\" id=\"fn-pick\"><\/div>\n    <div class=\"map-wrap\"><div class=\"map\" id=\"fn-map\"><\/div><\/div>\n  <\/section>\n\n\n<\/main>\n\n<div class=\"scrim\" id=\"scrim\"><\/div>\n<div class=\"toast\" id=\"toast\" hidden><\/div>\n<aside class=\"drawer\" id=\"drawer\" aria-live=\"polite\">\n  <button class=\"close\" id=\"drawer-close\" aria-label=\"Close\">×<\/button>\n  <div id=\"drawer-body\"><\/div>\n<\/aside>\n\n<script id=\"data\" type=\"application/json\">__DATA__<\/script>\n<script id=\"tpl\" type=\"application/json\">__TPL__<\/script>\n<script>\nconst D = JSON.parse(document.getElementById('data').textContent);\nconst W = D.meta.cycleWeeks;\nconst laneById = Object.fromEntries(D.lanes.map(l=>[l.id,l]));\nconst GROUPS = D.meta.groups;\nconst HIDDEN_LABEL = {team:'Team or pod (not drawn)', gate:'Decision (not drawn)'};\nconst KIND_LABEL = Object.assign(Object.fromEntries(GROUPS.map(g=>[g.id,g.name])), HIDDEN_LABEL);\nconst KIND_SHORT = Object.fromEntries(GROUPS.map(g=>[g.id,g.short]));\nconst shown = new Set(GROUPS.filter(g=>g.default).map(g=>g.id));\nconst cycClass = c => c===1?'c1':c===-1?'cm1':'c0';\nconst cycLabel = c => c===1?'+1':c===-1?'−1':'';\nconst cycName = c => c===1?D.meta.legend.cycle1:c===-1?D.meta.legend.cycleMinus1:D.meta.legend.cycle0;\nconst esc = s => String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));\nconst pct = b => (b/W*100)+'%';\nconst boundaryName = b => b%1!==0 ? 'Middle of week '+Math.ceil(b)\n  : b===0?'Start of week 1':b===W?'End of week '+W:'End of week '+b+' / start of week '+(b+1);\n\ndocument.getElementById('version').textContent = D.meta.version;\n\n/* ---------- cycle map ---------- */\nconst visibleMs = () => D.milestones.filter(m=>m.at!==null && shown.has(m.kind));\n\nfunction laneMapHTML(lanes){\n  let h = '';\n  h += '<div class=\"grid phase-row\"><div class=\"phase\"><\/div>';\n  D.meta.phases.forEach((p,i)=>{ const span=p.weeks[1]-p.weeks[0]+1; h+=`<div class=\"phase ${i>0?'p2':''}\" style=\"grid-column:span ${span}\">${esc(p.name)} · ${span} wk<\/div>`; });\n  h += '<\/div>';\n  h += '<div class=\"grid week-row\"><div class=\"corner\"><\/div>';\n  for(let w=1;w<=W;w++) h += `<div class=\"wk mono ${w===3?'w3':''}\">Week ${w}<\/div>`;\n  h += '<\/div>';\n  const vis = visibleMs();\n  const byAt = {};\n  vis.forEach(m=>{ (byAt[m.at]=byAt[m.at]||[]).push(m); });\n  h += `<div class=\"grid\"><div class=\"ms-row\"><div class=\"ms-track\" style=\"--msw:calc(100% / ${W} - 10px)\">`;\n  [...new Set(vis.filter(m=>m.at%1!==0).map(m=>m.at))].forEach(at=>{\n    h += `<div class=\"tick\" style=\"left:${pct(at)}\"><\/div>`;\n  });\n  Object.keys(byAt).map(Number).sort((a,b)=>a-b).forEach(at=>{\n    const list = byAt[at];\n    const edge = at===0?' edge-first':'';\n    h += `<div class=\"ms-group${at%1!==0?' mid':''}${edge}\" style=\"left:${pct(+at)}\">`;\n    list.forEach(m=>{\n      h += `<button class=\"ms ${m.status==='optional'?'optional':''}\" data-ms=\"${m.id}\" title=\"${esc(m.name)}\"><span class=\"lbl\">`\n        + `<span class=\"who\"><i class=\"dot ${m.kind}\"><\/i>${esc(KIND_SHORT[m.kind]||m.kind)}<\/span>`\n        + `<span class=\"nm\">${esc(m.name)}${m.cycle===1?' <span class=\"cyc\">(+1)<\/span>':''}<\/span>`\n        + (m.repeats?`<span class=\"rep\">× ${esc(m.repeats)}<\/span>`:'')\n        + `<\/span><\/button>`;\n    });\n    h += '<\/div>';\n  });\n  h += '<\/div><\/div><\/div>';\n  h += '<div class=\"body\"><div class=\"lines\">';\n  for(let b=1;b<W;b++){\n    const isMs = vis.some(m=>m.at===b);\n    h += `<div class=\"line ${b===2?'phase-line':''} ${isMs?'ms-line':''}\" style=\"left:${pct(b)}\"><\/div>`;\n  }\n  [...new Set(vis.filter(m=>m.at%1!==0).map(m=>m.at))].forEach(at=>{\n    h += `<div class=\"tick\" style=\"left:${pct(at)}\"><\/div>`;\n  });\n  h += '<\/div>';\n  lanes.forEach(l=>{\n    h += `<div class=\"lane\" style=\"--lc:var(--${l.color});--lsoft:var(--${l.color}-soft)\">`;\n    h += `<div class=\"lane-label\" data-lane=\"${l.id}\"><b>${esc(l.name)}<\/b>${l.flag?`<span class=\"flag\">${esc(l.flag)}<\/span>`:''}<span class=\"sum\">${esc(l.summary)}<\/span><\/div>`;\n    D.activities.map((a,i)=>({a,i})).filter(x=>x.a.lane===l.id).forEach(({a,i})=>{\n      const row = a.layer==='primary'?1:2;\n      h += `<button class=\"blk ${a.layer} ${cycClass(a.cycle)}\" style=\"grid-row:${row};grid-column:${a.weeks[0]+1} / ${a.weeks[1]+2}\" data-act=\"${i}\">${a.cycle!==0?`<span class=\"cyc\">${cycLabel(a.cycle)}<\/span>`:''}<span>${esc(a.title)}<\/span><\/button>`;\n    });\n    h += '<\/div>';\n  });\n  h += '<\/div>';\n  return h;\n}\n\nfunction sizeMsRows(){\n  // Two bands: chips on week boundaries up top, mid-week chips below them. A mid-week\n  // position sits half a week from its neighbours, which is too close to share a band.\n  document.querySelectorAll('.ms-row').forEach(row=>{\n    const groups=[...row.querySelectorAll('.ms-group')];\n    const onBoundary=groups.filter(g=>!g.classList.contains('mid'));\n    const midWeek=groups.filter(g=>g.classList.contains('mid'));\n    const boundaryH=onBoundary.length?Math.max(...onBoundary.map(g=>g.offsetHeight)):0;\n    const band=boundaryH?boundaryH+10:0;\n    midWeek.forEach(g=>{ g.style.top=(10+band)+'px'; });\n    const midH=midWeek.length?Math.max(...midWeek.map(g=>g.offsetHeight)):0;\n    row.style.height=Math.max(72, 10+band+midH+12)+'px';\n  });\n}\nfunction buildMap(){\n  document.getElementById('map').innerHTML = laneMapHTML(D.lanes);\n\n  const am = document.getElementById('artmap');\n  let g = '<div class=\"grid week-row\"><div class=\"corner\"><\/div>';\n  for(let w=1;w<=W;w++) g += `<div class=\"wk mono ${w===3?'w3':''}\">Week ${w}<\/div>`;\n  g += '<\/div><div class=\"art-grid\">';\n  D.artifacts.forEach((a,i)=>{\n    const cps = a.checkpoints || [];\n    g += `<div class=\"art-row\"><button class=\"art-label\" data-art=\"${i}\"><b>${esc(a.name)}<\/b><span>${esc(a.owner)}<\/span>${a.after?`<span class=\"art-after\">→ ${esc(a.after)}<\/span>`:''}<\/button><div class=\"art-track\">`;\n    if(!cps.length){\n      g += `<div class=\"art-bar ongoing\" style=\"left:0;width:100%\"><\/div><div class=\"art-ongoing\">${esc(a.cadence||'Ongoing')}<\/div>`;\n    } else {\n      const from = Math.min(...cps.map(c=>c.at)), to = Math.max(...cps.map(c=>c.at));\n      g += `<div class=\"art-bar ${a.cycle===1?'c1':''}\" style=\"left:${pct(from)};width:calc(${pct(to)} - ${pct(from)})\"><\/div>`;\n      cps.forEach(c=>{\n        g += `<div class=\"cp ${c.readiness?'has-r':''}\" style=\"left:${pct(c.at)}\">${c.readiness?`<b>${esc(c.readiness)}<\/b>`:''}<i><\/i><small>${esc(c.label)}<\/small><\/div>`;\n      });\n    }\n    g += '<\/div><\/div>';\n  });\n  g += '<\/div>';\n  am.innerHTML = g;\n\n  const notesEl = document.getElementById('notes');\n  if(D.meta.showNotes && D.notes && D.notes.length){ notesEl.innerHTML = `<h2>Notes and recent changes<\/h2><ul>${D.notes.map(n=>`<li>${esc(n)}<\/li>`).join('')}<\/ul>`; } else { notesEl.hidden = true; }\n}\n\nfunction buildGroupControls(){\n  document.getElementById('group-controls').innerHTML = '<span class=\"ctl-label\">Meetings<\/span>'\n    + GROUPS.map(g=>`<label class=\"toggle\"><input type=\"checkbox\" data-group=\"${g.id}\" ${shown.has(g.id)?'checked':''}> <i class=\"dot ${g.id}\"><\/i> ${esc(g.name)}<\/label>`).join('')\n    + '<button class=\"btn quiet\" data-groups=\"all\">All<\/button><button class=\"btn quiet\" data-groups=\"none\">None<\/button>';\n}\nfunction redrawMaps(){ buildMap(); buildWeek(); buildFn(); applyFilters(); sizeMsRows(); }\ndocument.getElementById('group-controls').addEventListener('change', e=>{\n  const id = e.target.dataset.group; if(!id) return;\n  if(e.target.checked) shown.add(id); else shown.delete(id);\n  redrawMaps();\n});\ndocument.getElementById('group-controls').addEventListener('click', e=>{\n  const b = e.target.closest('[data-groups]'); if(!b) return;\n  shown.clear();\n  if(b.dataset.groups==='all') GROUPS.forEach(g=>shown.add(g.id));\n  buildGroupControls(); redrawMaps();\n});\n\nfunction applyFilters(){\n  const show = {c0:document.getElementById('show-c0').checked, c1:document.getElementById('show-c1').checked, cm1:document.getElementById('show-cm1').checked};\n  document.querySelectorAll('#map .blk').forEach(b=>{\n    const c = b.classList.contains('c1')?'c1':b.classList.contains('cm1')?'cm1':'c0';\n    b.classList.toggle('faded', !show[c]);\n  });\n}\n\n/* ---------- drawer ---------- */\nconst drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim'), dbody = document.getElementById('drawer-body');\nfunction openDrawer(html){ dbody.innerHTML = html; drawer.classList.add('open'); scrim.classList.add('open'); }\nfunction closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }\ndocument.getElementById('drawer-close').onclick = closeDrawer; scrim.onclick = closeDrawer;\ndocument.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });\n\nfunction list(arr){ return arr && arr.length ? `<ul>${arr.map(x=>`<li>${esc(x)}<\/li>`).join('')}<\/ul>` : '<span class=\"empty\">None recorded<\/span>'; }\n\nfunction msHTML(m){\n  const where = m.at===null ? (m.status==='recurring'?'Recurring':'Unplaced') : boundaryName(m.at);\n  return `<div class=\"eyebrow\"><i class=\"dot ${m.kind}\"><\/i>${KIND_LABEL[m.kind]||m.kind}${m.status?` · <span class=\"pill\">${esc(m.status)}<\/span>`:''}${m.cycle===1?` · <span class=\"pill c1\">for next cycle<\/span>`:''}<\/div>\n  <h2>${esc(m.name)}<\/h2>\n  <p class=\"meta mono\" style=\"color:var(--muted);font-size:12px\">${where}<\/p>\n  ${m.detail?`<p>${esc(m.detail)}<\/p>`:''}\n  <dl class=\"kv\"><dt>Who attends<\/dt><dd>${esc(m.audience)}<\/dd>${m.repeats?`<dt>How often<\/dt><dd>Once ${esc(m.repeats)}<\/dd>`:''}<dt>Inputs<\/dt><dd>${list(m.inputs)}<\/dd><dt>Outcomes<\/dt><dd>${list(m.outcomes)}<\/dd><\/dl>`;\n}\nfunction actHTML(a){\n  const l = laneById[a.lane];\n  const wk = a.weeks[0]===a.weeks[1]?`Week ${a.weeks[0]}`:`Weeks ${a.weeks[0]}–${a.weeks[1]}`;\n  return `<div class=\"eyebrow\"><span class=\"swatch\" style=\"background:var(--${l.color})\"><\/span>${esc(l.name)} · ${a.layer} focus · <span class=\"pill ${cycClass(a.cycle)}\">${esc(cycName(a.cycle))}<\/span><\/div>\n  <h2>${esc(a.title)}<\/h2><p class=\"mono\" style=\"color:var(--muted);font-size:12px\">${wk}<\/p><p>${esc(a.detail)}<\/p>`;\n}\nfunction artHTML(a){\n  const cps = a.checkpoints || [];\n  const progression = cps.length\n    ? `<ul>${cps.map(c=>`<li>${boundaryName(c.at)}: ${esc(c.label)}${c.readiness?` <b>(${esc(c.readiness)})<\/b>`:''}<\/li>`).join('')}${a.after?`<li>${esc(a.after)}<\/li>`:''}<\/ul>`\n    : esc(a.cadence||'Ongoing; no fixed points in the cycle');\n  return `<div class=\"eyebrow\">Document${a.cycle===1?' · <span class=\"pill c1\">for next cycle<\/span>':''}<\/div><h2>${esc(a.name)}<\/h2>\n  <p>${esc(a.purpose)}<\/p><dl class=\"kv\"><dt>Owner<\/dt><dd>${esc(a.owner)}<\/dd><dt>Progression<\/dt><dd>${progression}<\/dd><\/dl>`;\n}\n\nlet sel = null;\nfunction renderSel(){\n  if(!sel) return;\n  if(EDIT.on) { openDrawer(EDIT.form(sel)); return; }\n  if(sel.kind==='ms') openDrawer(msHTML(D.milestones.find(m=>m.id===sel.id)));\n  else if(sel.kind==='act') openDrawer(actHTML(D.activities[sel.i]));\n  else if(sel.kind==='art') openDrawer(artHTML(D.artifacts[sel.i]));\n  else if(sel.kind==='lane') openDrawer(`<div class=\"eyebrow\">Function<\/div><h2>${esc(laneById[sel.id].name)}<\/h2><p>${esc(laneById[sel.id].summary)}<\/p>`);\n}\ndocument.addEventListener('click', e=>{\n  if(e.target.closest('#drawer')) return;\n  const ms = e.target.closest('[data-ms]'); if(ms){ sel={kind:'ms', id:ms.dataset.ms}; renderSel(); return; }\n  const act = e.target.closest('[data-act]'); if(act){ sel={kind:'act', i:+act.dataset.act}; renderSel(); return; }\n  const art = e.target.closest('[data-art]'); if(art){ sel={kind:'art', i:+art.dataset.art}; renderSel(); return; }\n  const lane = e.target.closest('[data-lane]'); if(lane && EDIT.on){ sel={kind:'lane', id:lane.dataset.lane}; renderSel(); return; }\n});\n\n/* ---------- this week ---------- */\nlet curWeek = 1, curFn = D.lanes[0].id;\nfunction blkBtn(a, i){ return `<button class=\"blk ${a.layer} ${cycClass(a.cycle)}\" data-act=\"${i}\">${a.cycle!==0?`<span class=\"cyc\">${cycLabel(a.cycle)}<\/span>`:''}<span>${esc(a.title)}<\/span><\/button>`; }\nfunction msItem(m){ return `<button class=\"ms-item\" data-ms=\"${m.id}\"><i class=\"dot ${m.kind}\" style=\"margin-top:4px;flex:none\"><\/i><span><b>${esc(m.name)}<\/b>${m.cycle===1?' <span class=\"pill c1\">+1<\/span>':''}<small>${esc(KIND_SHORT[m.kind]||m.kind)} · ${esc(m.audience)}<\/small><\/span><\/button>`; }\nfunction buildWeek(){\n  document.getElementById('week-pick').innerHTML = Array.from({length:W},(_,i)=>`<button aria-pressed=\"${i+1===curWeek}\" data-week=\"${i+1}\">Week ${i+1}<\/button>`).join('');\n  const vis = visibleMs();\n  const opens = vis.filter(m=>m.at===curWeek-1), during = vis.filter(m=>m.at===curWeek-0.5), closes = vis.filter(m=>m.at===curWeek);\n  const phase = D.meta.phases.find(p=>curWeek>=p.weeks[0]&&curWeek<=p.weeks[1]);\n  let h = `<p class=\"intro\"><b>Week ${curWeek}<\/b> · ${esc(phase.name)}<\/p>`;\n  const bound = (label, list2) => `<div class=\"bound\"><h3>${label}<\/h3>${list2.length?list2.map(msItem).join(''):'<span class=\"empty\">No milestone<\/span>'}<\/div>`;\n  h += `<div class=\"bounds\">${bound('Opens the week', opens)}${bound('During the week', during)}${bound('Closes the week', closes)}<\/div>`;\n  h += '<div class=\"wk-cols\">';\n  D.lanes.forEach(l=>{\n    const acts = D.activities.map((a,i)=>({a,i})).filter(x=>x.a.lane===l.id && curWeek>=x.a.weeks[0] && curWeek<=x.a.weeks[1]).sort((x,y)=>(x.a.layer==='primary'?0:1)-(y.a.layer==='primary'?0:1));\n    h += `<div class=\"wk-lane\" style=\"--lc:var(--${l.color});--lsoft:var(--${l.color}-soft)\"><h3>${esc(l.name)}<\/h3>${acts.length?acts.map(x=>blkBtn(x.a,x.i)).join(''):'<span class=\"empty\">Nothing scheduled<\/span>'}<\/div>`;\n  });\n  h += '<\/div>';\n  document.getElementById('week-body').innerHTML = h;\n}\ndocument.getElementById('week-pick').addEventListener('click', e=>{ const b=e.target.closest('[data-week]'); if(b){ curWeek=+b.dataset.week; buildWeek(); } });\n\n/* ---------- by function ---------- */\nfunction buildFn(){\n  document.getElementById('fn-pick').innerHTML = D.lanes.map(l=>`<button aria-pressed=\"${l.id===curFn}\" data-fn=\"${l.id}\">${esc(l.name)}<\/button>`).join('');\n  const l = laneById[curFn];\n  document.getElementById('fn-map').innerHTML = laneMapHTML([l]);\n  sizeMsRows();\n}\ndocument.getElementById('fn-pick').addEventListener('click', e=>{ const b=e.target.closest('[data-fn]'); if(b){ curFn=b.dataset.fn; buildFn(); } });\n\n/* ---------- editing (writers of the Claude artifact only) ---------- */\nconst EDIT = { on:false, art:null };\nconst KINDS = GROUPS.map(g=>g.id).concat(Object.keys(HIDDEN_LABEL));\nconst toast = (msg, ms=3200) => { const el=document.getElementById('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true, ms); };\nconst field = (label, name, val, type='input', attrs='') => type==='textarea'\n  ? `<label>${label}<textarea name=\"${name}\" ${attrs}>${esc(val??'')}<\/textarea><\/label>`\n  : `<label>${label}<input name=\"${name}\" value=\"${esc(val??'')}\" ${attrs}><\/label>`;\nconst select = (label, name, val, opts) => `<label>${label}<select name=\"${name}\">${opts.map(([v,l])=>`<option value=\"${v}\" ${String(v)===String(val)?'selected':''}>${l}<\/option>`).join('')}<\/select><\/label>`;\nconst weekOpts = Array.from({length:W},(_,i)=>[i+1,'Week '+(i+1)]);\nconst boundaryOpts = Array.from({length:W*2+1},(_,i)=>i/2).map(b=>[b, boundaryName(b)]);\nconst lines = arr => (arr||[]).join('\\n');\nconst unlines = s => s.split('\\n').map(x=>x.trim()).filter(Boolean);\n\nEDIT.form = function(s){\n  let title='', body='';\n  if(s.kind==='act'){ const a=D.activities[s.i]; title='Edit activity';\n    body = field('Title','title',a.title) + field('Description','detail',a.detail,'textarea')\n      + `<div class=\"row\">${select('From','w0',a.weeks[0],weekOpts)}${select('To','w1',a.weeks[1],weekOpts)}<\/div>`\n      + `<div class=\"row3\">${select('Lane','lane',a.lane,D.lanes.map(l=>[l.id,l.name]))}${select('Band','layer',a.layer,[['primary','Primary'],['secondary','Secondary']])}${select('Cycle','cycle',a.cycle,[[0,'This cycle'],[1,'Next cycle (+1)'],[-1,'Prior cycle (−1)']])}<\/div>`; }\n  else if(s.kind==='ms'){ const m=D.milestones.find(x=>x.id===s.id); title='Edit milestone';\n    body = field('Name','name',m.name) + field('Description','detail',m.detail,'textarea') + field('Who attends','audience',m.audience)\n      + field('Inputs (one per line)','inputs',lines(m.inputs),'textarea') + field('Outcomes (one per line)','outcomes',lines(m.outcomes),'textarea')\n      + `<div class=\"row3\">${select('When','at',m.at,boundaryOpts)}${select('Audience type','kind',m.kind,KINDS.map(k=>[k,KIND_LABEL[k]||k]))}${select('Cycle','cycle',m.cycle,[[0,'This cycle'],[1,'Next cycle (+1)']])}<\/div>`\n      + field('Repeats (optional, e.g. per opportunity)','repeats',m.repeats||'')\n      + select('Status','status',m.status||'',[['','Normal'],['optional','Optional']]); }\n  else if(s.kind==='art'){ const a=D.artifacts[s.i]; title='Edit document';\n    body = field('Name','name',a.name) + field('Owner','owner',a.owner) + field('Purpose','purpose',a.purpose,'textarea')\n      + field('Checkpoints (one per line: week boundary | label | readiness; leave empty for an ongoing document)','checkpoints', (a.checkpoints||[]).map(c=>[c.at,c.label,c.readiness||''].join(' | ')).join('\\n'),'textarea')\n      + field('Cadence (shown when there are no checkpoints)','cadence',a.cadence||'')\n      + field('After the cycle','after',a.after||'') + select('Cycle','cycle',a.cycle,[[0,'This cycle'],[1,'Next cycle (+1)']]); }\n  else if(s.kind==='lane'){ const l=laneById[s.id]; title='Edit function';\n    body = field('Name','name',l.name) + field('Summary (shown on hover)','summary',l.summary,'textarea'); }\n  const undo = (D.history||[]).length ? `<button type=\"button\" class=\"btn quiet\" id=\"undo-btn\" title=\"${esc(D.history[D.history.length-1].what)}\">Undo last save<\/button>` : '';\n  return `<div class=\"eyebrow\">${title}<\/div><p class=\"edit-note\">Saving publishes a new version of this artifact. The company page updates when you ask Claude to publish.<\/p>\n  <form class=\"form\" id=\"edit-form\">${body}<div class=\"err\" id=\"edit-err\" hidden><\/div><div class=\"actions\"><button type=\"submit\" class=\"btn primary\" id=\"save-btn\">Save<\/button><button type=\"button\" class=\"btn\" id=\"cancel-btn\">Cancel<\/button>${undo}<\/div><\/form>`;\n};\n\nEDIT.apply = function(s, f){\n  const g = n => (f.get(n)??'').toString().trim();\n  let before, what;\n  if(s.kind==='act'){ const a=D.activities[s.i]; before=JSON.parse(JSON.stringify(a)); what='activity \"'+a.title+'\"';\n    const w0=+g('w0'), w1=+g('w1'); if(w1<w0) throw new Error('\"To\" week must not be before \"From\" week.');\n    if(!g('title')) throw new Error('Title is required.');\n    Object.assign(a,{title:g('title'),detail:g('detail'),weeks:[w0,w1],lane:g('lane'),layer:g('layer'),cycle:+g('cycle')}); }\n  else if(s.kind==='ms'){ const m=D.milestones.find(x=>x.id===s.id); before=JSON.parse(JSON.stringify(m)); what='milestone \"'+m.name+'\"';\n    if(!g('name')) throw new Error('Name is required.');\n    Object.assign(m,{name:g('name'),detail:g('detail'),audience:g('audience'),inputs:unlines(g('inputs')),outcomes:unlines(g('outcomes')),at:+g('at'),kind:g('kind'),cycle:+g('cycle')});\n    if(g('repeats')) m.repeats=g('repeats'); else delete m.repeats;\n    if(g('status')) m.status=g('status'); else delete m.status; }\n  else if(s.kind==='art'){ const a=D.artifacts[s.i]; before=JSON.parse(JSON.stringify(a)); what='document \"'+a.name+'\"';\n    if(!g('name')) throw new Error('Name is required.');\n    const cps = unlines(g('checkpoints')).map(line=>{ const [at,label,readiness]=line.split('|').map(x=>x.trim()); const c={at:+at,label:label||''}; if(isNaN(c.at)||c.at<0||c.at>W) throw new Error('Each checkpoint must start with a week boundary from 0 to '+W+'.'); if(readiness) c.readiness=readiness; return c; });\n    Object.assign(a,{name:g('name'),owner:g('owner'),purpose:g('purpose'),checkpoints:cps,cycle:+g('cycle')});\n    if(g('cadence')) a.cadence=g('cadence');
